<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>연수교육 QR 인증</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteField, collection, query, where, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  // 학생 웹 — mobile-app의 QrMainScreen.js/qrAttendance.js/SimpleSignatureModal.js가 검증한
  // UX 흐름(스캔→시작서명 강제→체크인목록→종료서명 강제→구제요청 배너)만 개념으로 가져와
  // 순수 HTML/JS로 새로 작성했다(React Native 코드를 그대로 옮기지 않음). 위치(GPS) 권한/
  // 로직은 이 서비스에 전혀 필요 없어 일절 넣지 않았다.

  const FUNC_URL = 'https://asia-northeast3-yeonsu-qr-auth.cloudfunctions.net';
  const KAKAO_REST_KEY = 'ca34b3c2a0cf2d0fe87d9f18b39aa8d8';

  const app = initializeApp({
    projectId: "yeonsu-qr-auth",
    appId: "1:1001009945495:web:9f99c789e6d13404a442d2",
    storageBucket: "yeonsu-qr-auth.firebasestorage.app",
    apiKey: "AIzaSyA68rFB5yLol3v9acbwRIFPtDdX2hf2FQw",
    authDomain: "yeonsu-qr-auth.firebaseapp.com",
    messagingSenderId: "1001009945495",
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ── 상태 ──
  let kakaoId = null;
  let studentName = '';
  // 방금 스캔한 QR의 세션 id(payload의 s) — 오늘 날짜 안에서는 새로고침/재방문에도
  // localStorage로 남겨 체크인목록/서명요청/시간표 조회에 계속 쓴다(스캔을 매번
  // 다시 안 해도 되게). 날짜가 바뀌면 무시하고 다시 스캔할 때까지 null로 둔다.
  let currentSessionId = null;
  let rosterStatus = null; // sessions/{sid}/roster/{kakaoId} — 시작/종료 서명 상태
  let makeupRequest = null; // 이 학생의 pending 서명요청 1건(가장 오래된 것)
  let checkins = [];

  function todayKST() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function ensureAnonymousAuth() {
    // Firestore 클라이언트 접근용(보안규칙: request.auth != null) — 카카오 로그인과는
    // 별개로 필요하다(qr-admin/mobile-app과 동일 패턴).
    return new Promise((resolve) => {
      if (auth.currentUser) { resolve(); return; }
      signInAnonymously(auth).then(() => resolve()).catch((e) => { console.warn('익명 로그인 실패:', e); resolve(); });
    });
  }

  function setCurrentSessionId(sid) {
    currentSessionId = sid;
    localStorage.setItem('ce_session_id', sid);
    localStorage.setItem('ce_session_date', todayKST());
  }

  function restoreSessionIdIfToday() {
    const savedDate = localStorage.getItem('ce_session_date');
    const savedSid = localStorage.getItem('ce_session_id');
    if (savedSid && savedDate === todayKST()) currentSessionId = savedSid;
  }

  // 기기에 저장된 세션 id가 없을 때의 복구 경로 — 로그아웃으로 지워졌거나 다른
  // 기기/브라우저로 들어온 경우다. 체크인 때 Cloud Function이 학생 문서에 남겨둔
  // lastSessionId를 쓴다(오늘 것일 때만). 로그인 직후 이미 읽는 문서라 추가 조회가 없다.
  function recoverSessionIdFromStudentDoc(studentData) {
    if (!studentData) return;
    if (studentData.lastSessionDate !== todayKST()) return;
    if (!studentData.lastSessionId) return;
    setCurrentSessionId(studentData.lastSessionId);
  }

  // ── 화면 전환 ──
  function showLoginScreen(msg) {
    document.getElementById('registration-screen').hidden = true;
    document.getElementById('main-screen').hidden = true;
    document.getElementById('login-screen').hidden = false;
    const errEl = document.getElementById('login-error');
    if (msg) { errEl.textContent = msg; errEl.hidden = false; } else { errEl.hidden = true; }
  }

  function showRegistration() {
    document.getElementById('login-screen').hidden = true;
    document.getElementById('main-screen').hidden = true;
    document.getElementById('registration-screen').hidden = false;
  }

  function enterMain() {
    document.getElementById('login-screen').hidden = true;
    document.getElementById('registration-screen').hidden = true;
    document.getElementById('main-screen').hidden = false;
    document.getElementById('student-name-label').textContent = (studentName || '학생') + '님';
    document.getElementById('topbar-date').textContent = todayKST().slice(2).replace(/-/g, '.');   // 26.10.23
    loadCheckins();
    loadRosterStatus();
    loadMakeupRequests();
    loadSchedule();
  }

  // ── 카카오 로그인 ──
  window.doKakaoLogin = function () {
    // 카카오 페이지가 뜰 때까지 화면이 멈춘 것처럼 보여 버튼을 또 누르게 된다 — 어둡게 덮어 막는다.
    showLoading(true);
    const redirectUri = window.location.origin + window.location.pathname;
    const url = `https://kauth.kakao.com/oauth/authorize?client_id=${KAKAO_REST_KEY}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code`;
    // 바로 이동시키면 로딩이 그려지기 전에 넘어가 아무 변화도 못 볼 수 있다 — 한 프레임 그린 뒤 이동한다.
    requestAnimationFrame(() => setTimeout(() => { window.location.href = url; }, 60));
  };

  window.doLogout = function () {
    localStorage.removeItem('ce_kakao_id');
    localStorage.removeItem('ce_kakao_nickname');
    // ce_session_id/ce_session_date는 남긴다 — 지우면 재로그인 때 어느 세션을
    // 봐야 할지 몰라 이미 찍은 출석이 안 보인다. 세션 id는 '기관_날짜'라
    // 사용자별 값이 아니고, 체크인 조회는 kakaoId로 거르므로 남겨도 안전하다.
    kakaoId = null;
    studentName = '';
    showLoginScreen();
  };

  // ── 휴대폰 SMS 인증(가입 시 필수) ──
  // 나중에 관리자가 엑셀(면허번호/근무처/이름/휴대폰번호)로 매칭할 때 휴대폰번호가 확실한
  // 키가 되어야 해서, 타이핑한 번호를 그대로 믿지 않고 SMS 인증을 거친다.
  let phoneVerified = false;

  // 버튼을 눌렀는데 아무 변화가 없으면 학생이 눌린 건지 몰라 계속 다시 누른다.
  // 요청이 도는 동안 글자를 '...중'으로 바꾸고 점 애니메이션을 돌려 진행 중임을 보인다
  // (누름 자체의 즉각 반응은 CSS :active가 담당).
  async function withBusy(btn, busyLabel, fn) {
    if (!btn || btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.classList.add('is-busy');
    btn.textContent = busyLabel;
    showLoading(true);
    try {
      return await fn();
    } finally {
      showLoading(false);
      btn.classList.remove('is-busy');
      btn.disabled = false;
      // 처리 중에 다른 곳에서 글자를 바꿨으면(예: '인증번호 받기'->'재전송') 그걸 존중한다.
      if (btn.textContent === busyLabel) btn.textContent = original;
    }
  }

  function regPhoneDigits() {
    return String(document.getElementById('reg-phone').value || '').replace(/\D/g, '');
  }

  // 안드로이드 크롬(WebOTP): 문자 마지막 줄이 "@도메인 #코드" 형식이면 브라우저가 문자를 읽어 코드를
  // 넘겨준다(처음엔 "허용" 안내가 한 번 뜬다). 다른 브라우저는 이 API가 없어 키보드 제안(one-time-code)에 맡긴다.
  let webOtpAbort = null;
  function stopWebOtp() {
    if (webOtpAbort) { webOtpAbort.abort(); webOtpAbort = null; }
  }
  function startWebOtp() {
    stopWebOtp();
    if (!('OTPCredential' in window)) return;
    webOtpAbort = new AbortController();
    navigator.credentials.get({ otp: { transport: ['sms'] }, signal: webOtpAbort.signal })
      .then((cred) => {
        if (!cred || !cred.code) return;
        document.getElementById('reg-otp-code').value = String(cred.code).replace(/\D/g, '');
        onRegOtpInput();   // 6자리가 차면 바로 확인·가입
      })
      .catch(() => {});   // 거부/취소/미지원이면 직접 입력하면 된다
  }

  // 처음 단계 — "인증번호 받기" 버튼만 보인다.
  function showRegSendStep() {
    stopWebOtp();
    document.getElementById('btn-request-otp').hidden = false;
    document.getElementById('reg-otp-row').hidden = true;
    document.getElementById('reg-otp-code').value = '';
  }

  // 인증번호를 받은 뒤 번호를 고치면 그 번호로 온 인증번호가 아니게 되므로(다른 번호로 가입되는 것
  // 방지) 처음 단계로 되돌린다.
  window.onRegPhoneInput = function () {
    phoneVerified = false;
    showRegSendStep();
  };

  // 큰 "인증번호 받기"와 작은 "재전송" 둘 다 이 함수를 쓴다(누른 버튼이 busy 표시를 받는다).
  window.requestRegOtp = async function (btnArg) {
    const name = document.getElementById('reg-name').value.trim();
    const phone = regPhoneDigits();
    const errEl = document.getElementById('reg-error');
    errEl.hidden = true;
    // 인증번호가 맞는 순간 바로 가입되므로 이름이 비어 있으면 여기서 막는다.
    if (!name) {
      errEl.textContent = '이름을 먼저 입력해주세요.';
      errEl.hidden = false;
      return;
    }
    if (!phone) {
      errEl.textContent = '휴대폰번호를 입력해주세요.';
      errEl.hidden = false;
      return;
    }
    const btn = btnArg || document.getElementById('btn-request-otp');
    // 누른 순간(사용자 동작 안)에 인증번호 칸을 열고 커서를 둔다 — 발송이 끝난 뒤에 옮기면 폰에서
    // 키보드가 안 뜰 수 있다. 발송에 실패하면 아래에서 다시 닫는다.
    const otpRow = document.getElementById('reg-otp-row');
    const otpInput = document.getElementById('reg-otp-code');
    const wasOpen = !otpRow.hidden;
    otpRow.hidden = false;
    otpInput.value = '';
    otpInput.focus();
    await withBusy(btn, '보내는 중', async () => {
      try {
        const res = await fetch(`${FUNC_URL}/requestOTP`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || '인증번호 발송 실패');
        document.getElementById('btn-request-otp').hidden = true;
        otpInput.focus();
        startWebOtp();
        errEl.textContent = '인증번호가 발송되었습니다.';
        errEl.hidden = false;
      } catch (e) {
        if (!wasOpen) otpRow.hidden = true;
        errEl.textContent = e.message;
        errEl.hidden = false;
      }
    });
  };

  // 인증번호는 항상 6자리 숫자 — 마지막 자리를 치는 순간 확인하고, 맞으면 바로 가입까지 끝낸다.
  window.onRegOtpInput = function () {
    const input = document.getElementById('reg-otp-code');
    const digits = input.value.replace(/\D/g, '');
    if (digits !== input.value) input.value = digits;
    if (digits.length === 6) verifyRegOtp();
  };

  let regBusy = false;   // 6자리가 연달아 입력돼도 확인·가입이 두 번 돌지 않게 한다

  window.verifyRegOtp = async function () {
    if (regBusy) return;
    const name = document.getElementById('reg-name').value.trim();
    const phone = regPhoneDigits();
    const code = document.getElementById('reg-otp-code').value.trim();
    const errEl = document.getElementById('reg-error');
    errEl.hidden = true;
    if (code.length !== 6) return;
    // 인증번호는 한 번 확인하면 쓰이므로, 이름이 비었을 땐 확인하기 전에 막아야 다시 입력할 수 있다.
    if (!name) {
      errEl.textContent = '이름을 입력한 뒤 인증번호 마지막 자리를 다시 입력해주세요.';
      errEl.hidden = false;
      return;
    }
    regBusy = true;
    stopWebOtp();
    showLoading(true);
    try {
      const res = await fetch(`${FUNC_URL}/verifyOTP`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, code }),
      });
      const data = await res.json();
      if (!data.verified) throw new Error(data.message || '인증번호가 일치하지 않습니다.');
      phoneVerified = true;
      await submitRegistration(name, phone);   // 인증이 맞으면 가입 완료 버튼 없이 바로 가입
    } catch (e) {
      phoneVerified = false;
      errEl.textContent = e.message;
      errEl.hidden = false;
    } finally {
      regBusy = false;
      showLoading(false);
    }
  };

  async function submitRegistration(name, phone) {
    const errEl = document.getElementById('reg-error');
    try {
      await setDoc(doc(db, 'students', String(kakaoId)), {
        kakaoId: String(kakaoId), name, phone, phoneVerified: true, registeredAt: serverTimestamp(),
      });
      studentName = name;
      enterMain();
      await consumePendingScanIfAny();
    } catch (e) {
      // 인증번호는 이미 쓰였고 가입 버튼도 없으니, 처음 단계로 돌려 다시 받게 한다.
      phoneVerified = false;
      showRegSendStep();
      errEl.textContent = '가입 실패: ' + e.message + ' 인증번호를 다시 받아주세요.';
      errEl.hidden = false;
    }
  }

  async function afterKakaoLogin() {
    try {
      const snap = await getDoc(doc(db, 'students', String(kakaoId)));
      if (!snap.exists()) { showRegistration(); return; }
      studentName = snap.data().name || '';
      restoreSessionIdIfToday();
      if (!currentSessionId) recoverSessionIdFromStudentDoc(snap.data());
      enterMain();
      await consumePendingScanIfAny();
    } catch (e) {
      showLoginScreen('학생 정보를 불러오지 못했습니다.');
    }
  }

  // 관리자가 보여주는 QR이 이제 순수 텍스트(JSON)가 아니라 이 페이지 링크(?scan=...)라서,
  // 가입 전인 학생이 일반 카메라 앱으로 그 QR을 찍어도 이 페이지로 넘어온다. 로그인/가입이
  // 안 끝난 상태로 열렸을 수 있으니, 그 scan 값을 sessionStorage에 저장해두고 로그인(카카오
  // 리다이렉트 왕복 포함)/가입이 끝나자마자 자동으로 출석 처리까지 이어서 한다 —
  // sessionStorage는 카카오 로그인 페이지로 나갔다 돌아와도(같은 탭) 그대로 남아있다.
  async function consumePendingScanIfAny() {
    const pending = sessionStorage.getItem('ce_pending_scan');
    if (!pending) return;
    sessionStorage.removeItem('ce_pending_scan');
    await handleScanResult(extractScanPayload(pending));
  }

  // QR 이미지에 인코딩된 텍스트가 URL(?scan=...)이면 그 안의 실제 체크인 payload만 꺼내고,
  // URL이 아니면(옛 형식/직접 테스트 등) 그대로 payload로 취급한다.
  function extractScanPayload(text) {
    try {
      const u = new URL(text);
      const p = u.searchParams.get('scan');
      if (p) return p;
    } catch {}
    return text;
  }

  async function boot() {
    await ensureAnonymousAuth();
    const urlParams = new URLSearchParams(window.location.search);
    const scanParam = urlParams.get('scan');
    if (scanParam) sessionStorage.setItem('ce_pending_scan', scanParam);
    const code = urlParams.get('code');
    if (code) {
      // 뒤로가기/새로고침 시 이 code를 재사용하지 않도록 URL을 즉시 정리한다.
      window.history.replaceState({}, '', window.location.pathname);
      try {
        const redirectUri = window.location.origin + window.location.pathname;
        const res = await fetch(`${FUNC_URL}/kakaoLogin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, redirect_uri: redirectUri }),
        });
        const data = await res.json();
        if (!data.kakaoId) { showLoginScreen(data.message || '카카오 로그인에 실패했습니다.'); return; }
        kakaoId = data.kakaoId;
        localStorage.setItem('ce_kakao_id', String(kakaoId));
        localStorage.setItem('ce_kakao_nickname', data.nickname || '');
      } catch (e) {
        showLoginScreen('로그인 처리 중 오류가 발생했습니다.');
        return;
      }
    } else {
      if (scanParam) window.history.replaceState({}, '', window.location.pathname);
      const saved = localStorage.getItem('ce_kakao_id');
      if (saved) kakaoId = saved;
    }
    if (!kakaoId) { showLoginScreen(); return; }
    await afterKakaoLogin();
  }

  // ── QR 스캔 ──
  let scanStream = null;
  let scanTimer = null;
  let scanTrack = null;
  let scanDetector = null;
  let scanDigitalZoom = 1;
  let scanLocked = false;

  window.openScanner = async function () {
    // 조퇴한 학생은 QR을 찍어도 적용되지 않는다(서버도 막는다) — 카메라를 열지 않고 알려준다.
    if (rosterStatus && rosterStatus.earlyLeaveAt) {
      showToast('조퇴 처리되어 QR 체크가 적용되지 않습니다. 계속 수강하려면 "조퇴 취소"를 눌러주세요.', 'error');
      return;
    }
    document.getElementById('scan-overlay').hidden = false;
    scanLocked = false;
    showLoading(true);   // 카메라가 켜지는 동안 검은 화면만 보이지 않게
    try {
      scanStream = await openCameraStream();
      scanTrack = scanStream.getVideoTracks()[0];
      const video = document.getElementById('qr-video');
      video.srcObject = scanStream;
      await video.play();
      // 움직이는 손에서도 초점이 계속 맞도록(지원 기기만).
      try {
        const caps = scanTrack.getCapabilities ? scanTrack.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await scanTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch {}
      // 브라우저 내장 QR 인식기(안드로이드 크롬 등)는 jsQR보다 작고 흐린 QR에 강하다.
      scanDetector = null;
      if ('BarcodeDetector' in window) {
        try { scanDetector = new BarcodeDetector({ formats: ['qr_code'] }); } catch { scanDetector = null; }
      }
      setScanZoom(1);
      scanLoop();
    } catch (e) {
      showToast('카메라를 열 수 없습니다: ' + e.message, 'error');
      closeScanner();
    } finally {
      showLoading(false);
    }
  };

  // 강의장 뒤에서는 QR이 화면에서 아주 작게 보인다 — 기본 해상도(보통 640x480)로는 점이 뭉개져
  // 못 읽으므로 고해상도를 요청하고, 그걸 못 주는 기기는 기본 설정으로 다시 연다.
  async function openCameraStream() {
    try {
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
    } catch (e) {
      if (e && e.name === 'NotAllowedError') throw e;   // 권한 거부는 다시 시도해도 같다
      return await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    }
  }

  // 확대 — 카메라가 줌을 지원하면 센서 줌(화질 손실 없음), 아니면(아이폰 등) 화면을 키우고
  // 키워진 가운데 부분만 읽는다.
  window.setScanZoom = function (z) {
    const video = document.getElementById('qr-video');
    const caps = scanTrack && scanTrack.getCapabilities ? scanTrack.getCapabilities() : {};
    if (caps.zoom) {
      const v = Math.min(caps.zoom.max, Math.max(caps.zoom.min, z));
      scanTrack.applyConstraints({ advanced: [{ zoom: v }] }).catch(() => {});
      scanDigitalZoom = 1;
      video.style.transform = '';
    } else {
      scanDigitalZoom = z;
      video.style.transform = z > 1 ? `scale(${z})` : '';
    }
    document.querySelectorAll('.scan-zoom-btn').forEach(b => b.classList.toggle('on', Number(b.dataset.z) === z));
  };

  window.closeScanner = function () {
    document.getElementById('scan-overlay').hidden = true;
    if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    scanTrack = null;
    scanDigitalZoom = 1;
    document.getElementById('qr-video').style.transform = '';
  };

  // 프레임 하나에서 QR 문자열을 읽는다(없으면 null).
  async function decodeFrame(video, canvas, ctx, n) {
    const vw = video.videoWidth, vh = video.videoHeight, z = scanDigitalZoom;
    const sw = Math.round(vw / z), sh = Math.round(vh / z);
    const sx = Math.round((vw - sw) / 2), sy = Math.round((vh - sh) / 2);
    // 1) 내장 인식기 — 원본 화질 그대로 읽는다.
    if (scanDetector) {
      let src = video;
      if (z > 1) { canvas.width = sw; canvas.height = sh; ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh); src = canvas; }
      const found = await scanDetector.detect(src);
      if (found.length && found[0].rawValue) return found[0].rawValue;
      if (n % 3 !== 0) return null;   // jsQR는 무거워서 보조로 3번에 한 번만 돌린다
    }
    // 2) jsQR — 센서 잡음이 있는 원본 크기 그대로는 오히려 못 읽는다(모의 실험: 원본 크기 0/4, 0.6~0.8배로
    //    줄이면 4/4). 그래서 프레임마다 0.8배(긴 변 1600px까지)와 0.6배를 번갈아 시도한다.
    //    저해상도 카메라(긴 변 800px 이하)는 줄이면 점이 뭉개지니 1배/0.8배로 한다.
    const longSide = Math.max(sw, sh);
    const scale = longSide <= 800
      ? (n % 2 === 0 ? 1 : 0.8)
      : (n % 2 === 0 ? Math.min(0.8, 1600 / longSide) : 0.6);
    const cw = Math.round(sw * scale), ch = Math.round(sh * scale);
    canvas.width = cw; canvas.height = ch;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
    const img = ctx.getImageData(0, 0, cw, ch);
    const code = jsQR(img.data, cw, ch, { inversionAttempts: 'dontInvert' });
    return code && code.data ? code.data : null;
  }

  function scanLoop() {
    const video = document.getElementById('qr-video');
    const canvas = document.getElementById('qr-canvas-hidden');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let n = 0;
    async function tick() {
      if (!scanStream) return;
      let text = null;
      try {
        if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) text = await decodeFrame(video, canvas, ctx, n++);
      } catch (e) {}   // 한 프레임 실패는 무시하고 다음 프레임에서 다시
      if (!scanStream) return;
      if (text && !scanLocked) {
        scanLocked = true;
        closeScanner();
        handleScanResult(extractScanPayload(text));
        return;
      }
      scanTimer = setTimeout(tick, 90);
    }
    tick();
  }

  async function handleScanResult(payload) {
    showLoading(true);
    try {
      const res = await fetch(`${FUNC_URL}/checkQrPeriod`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kakaoId: String(kakaoId), name: studentName, payload }),
      });
      const data = await res.json();
      // 결과가 오는 즉시 '확인중'을 닫는다. 뒤따르는 목록 갱신까지 붙들고 있으면
      // 체크인은 이미 끝났는데도 로딩이 한참 더 떠 있다(실측: 602ms + 258ms).
      // 학생에게는 아래 토스트/결과 팝업이 바로 뜨므로 빈 화면이 보이지 않는다.
      showLoading(false);
      // 성공/실패(duplicate 포함) 공통 — QR payload의 세션 id는 어느 쪽이든 최신 상태를
      // 다시 가져오는 데 필요하다(mobile-app QrMainScreen.js와 동일한 이유).
      let sid = null, scannedPeriod = null;
      try {
        const parsed = JSON.parse(payload);
        if (parsed && parsed.s) sid = parsed.s;
        if (parsed && parsed.p) scannedPeriod = Number(parsed.p);
      } catch {}
      if (sid) setCurrentSessionId(sid);

      if (data.success) {
        showToast(scannedPeriod ? `✅ ${scannedPeriod}세션 출석 체크 완료!` : '출석 체크 완료!', 'success');
        await loadCheckins();
        // 배열 순서가 아니라 방금 찍은 세션으로 집어야 정확하다(구제승인 등으로 순서가 어긋날 수 있다).
        popupForPeriod(scannedPeriod, 'success');
        // 서로 무관한 조회라 순차로 돌릴 이유가 없다(실측 258ms -> 65ms).
        await Promise.all([loadRosterStatus(), loadSchedule()]);
      } else if (data.duplicate) {
        // 같은 QR을 또 찍은 경우 — 언제 인정됐는지까지 보여줘야 학생이 안심한다.
        await loadCheckins();
        popupForPeriod(scannedPeriod, 'duplicate');
        await loadRosterStatus();
      } else {
        showToast(data.message || '출석 체크에 실패했습니다.', 'error');
        await loadRosterStatus();
      }
    } catch (e) {
      showToast('네트워크 오류가 발생했습니다.', 'error');
    } finally {
      showLoading(false);
      scanLocked = false;
    }
  }

  // 방금 찍은 세션의 체크인 시각을 찾아 결과 팝업을 띄운다(성공/중복 공통).
  function popupForPeriod(period, kind) {
    const c = checkins.find(x => x.period === period);
    if (!c || !c.checkedAt) return;
    const d = c.checkedAt.toDate ? c.checkedAt.toDate() : new Date(c.checkedAt);
    if (isNaN(d.getTime())) return;
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    showTimePopup(`${hh}:${mm}`, period, kind);
  }

  // ── 체크인 목록 ──
  function fmtCheckedAt(ts) {
    try {
      const d = ts && typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts);
      if (isNaN(d.getTime())) return '-';
      // 시각만 보여주면 어느 날 찍은 건지 알 수 없어서 월/일까지 같이 표기한다.
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${d.getMonth() + 1}월 ${d.getDate()}일 ${hh}:${mm}`;
    } catch { return '-'; }
  }

  async function loadCheckins() {
    if (!currentSessionId) { checkins = []; renderCheckins(); return; }
    try {
      const q = query(
        collection(db, 'sessions', currentSessionId, 'checkins'),
        where('kakaoId', '==', String(kakaoId)),
        orderBy('period', 'asc')
      );
      const snap = await getDocs(q);
      checkins = snap.docs.map(d => d.data());
      renderCheckins();
    } catch (e) {
      console.warn('체크인 조회 실패:', e);
    }
  }

  function renderCheckins() {
    const el = document.getElementById('checkin-list');
    const byPeriod = {};
    checkins.forEach(c => { byPeriod[c.period] = c; });
    const maxChecked = checkins.length ? Math.max(...checkins.map(c => c.period)) : 0;
    const earlyLeft = !!(rosterStatus && rosterStatus.earlyLeaveAt);
    const finalEnd = !earlyLeft && !!(rosterStatus && rosterStatus.endScannedAt);
    // 스캔 지점 p는 p세션의 '시작'이자 (p-1)세션의 '종료'다. 마지막 종료 QR(교육종료)은 새 세션이
    // 아니라 마지막 세션의 종료이므로 세션 줄로 따로 만들지 않는다. 아직 하나도 안 찍었어도 1세션 줄은
    // 보여줘야 "무엇을 찍어야 하는지"가 전달된다.
    const sessionCount = finalEnd && maxChecked > 1 ? maxChecked - 1 : Math.max(1, maxChecked);
    const fmt = (c) => {
      const t = c.checkedAt && typeof c.checkedAt.toDate === 'function' ? c.checkedAt.toDate() : new Date(c.checkedAt);
      const hhmm = isNaN(t.getTime()) ? '-' : String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      return hhmm + (c.makeupApproved ? '<span class="ck-sub">서명출석</span>' : '');
    };
    const cell = (c, state, label) => c
      ? `<div class="ck-cell done">${fmt(c)}</div>`
      : `<div class="ck-cell ${state}">${label}</div>`;
    // 중간에 못 찍은 지점은 그 뒤 처음 찍은 시각으로 채워 보여준다(같은 연보라). 화면 표시만 그렇고 기록은
    // 그대로다 — 이수 도장은 아래에서 실제로 앞뒤 지점을 둘 다 찍은 세션에만 붙인다.
    const shown = (q) => {
      if (byPeriod[q]) return byPeriod[q];
      for (let r = q + 1; r <= maxChecked; r++) if (byPeriod[r]) return { checkedAt: byPeriod[r].checkedAt };
      return null;
    };

    let html = '<div class="ck-head"><span>세션</span><span>시작</span><span>종료</span></div>';
    for (let p = 1; p <= sessionCount; p++) {
      const st = byPeriod[p];        // p세션 시작 = 지점 p
      const en = byPeriod[p + 1];    // p세션 종료 = 지점 p+1
      const done = !!st && !!en;   // 실제로 앞뒤를 둘 다 찍은 세션만 이수 도장
      const startCell = cell(shown(p), 'wait', '대기');
      const enShown = shown(p + 1);
      let endState = 'wait', endLabel = '대기';
      if (!enShown && earlyLeft && p === maxChecked) { endState = 'left'; endLabel = '조퇴'; }
      html += '<div class="ck-row">'
        + `<div class="ck-session${done ? ' done' : ''}"><span>${p}세션</span>${done ? '<span class="ck-stamp">이수완료</span>' : ''}</div>`
        + startCell
        + cell(enShown, endState, endLabel)
        + '</div>';
    }
    if (finalEnd) html += '<div class="ck-final">교육 종료 · 마지막 QR까지 완료</div>';
    else if (earlyLeft) html += '<div class="ck-final">조퇴 완료</div>';
    html += '<div class="ck-note">세션 사이에 찍는 QR 한 번이 앞 세션의 <b>종료</b>이자 다음 세션의 <b>시작</b>입니다. 다시 찍을 필요 없어요.</div>';
    el.innerHTML = html;
  }

  // ── 시작/종료 서명(스킵 불가) + 구제요청 서명(취소 가능) — 공용 서명 모달 ──
  let sigCtx = null;
  let sigDrawing = false;
  let sigHasContent = false;
  let sigModalKind = null; // 'start' | 'end' | 'makeup'
  // null이 아니면 이번 종료 서명이 '조퇴'라는 뜻이고, 값은 인정된 마지막 세션이다.
  let earlyLeavePeriod = null;

  function initSignatureCanvas() {
    const canvas = document.getElementById('sig-canvas');
    const ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * ratio;
    canvas.height = canvas.clientHeight * ratio;
    sigCtx = canvas.getContext('2d');
    sigCtx.scale(ratio, ratio);
    sigCtx.lineWidth = 2.5;
    sigCtx.lineCap = 'round';
    sigCtx.strokeStyle = '#111111';
    // 투명 캔버스에 검은 선만 그리면 다크 모드(강제 반전 포함)에서 배경이 어두워져 서명이 안 보인다 —
    // 흰 바탕을 직접 칠해 어디서 보든 흰 종이에 검은 글씨가 되게 한다.
    sigCtx.fillStyle = '#ffffff';
    sigCtx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    sigHasContent = false;
  }

  function sigPos(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function attachSignatureEvents() {
    const canvas = document.getElementById('sig-canvas');
    function start(e) { e.preventDefault(); sigDrawing = true; const p = sigPos(e, canvas); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }
    function move(e) { if (!sigDrawing) return; e.preventDefault(); const p = sigPos(e, canvas); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasContent = true; }
    function end() { sigDrawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }
  attachSignatureEvents();

  window.clearSignature = function () {
    if (!sigCtx) return;
    const canvas = document.getElementById('sig-canvas');
    sigCtx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    sigHasContent = false;
  };

  // 시작/종료 서명은 onClose 없이(스킵 불가), 구제요청 서명은 onClose를 넘겨서
  // "나중에 하기" 버튼이 뜬다 — mobile-app SimpleSignatureModal.js와 동일한 규칙.
  function openSignatureModal(kind, title, cancelable) {
    sigModalKind = kind;
    document.getElementById('sig-title').textContent = title;
    document.getElementById('sig-error').hidden = true;
    document.getElementById('sig-later-btn').hidden = !cancelable;
    document.getElementById('sig-modal').hidden = false;
    requestAnimationFrame(initSignatureCanvas);
  }

  window.closeSignatureModal = function () {
    document.getElementById('sig-modal').hidden = true;
    sigModalKind = null;
  };

  window.submitSignatureModal = async function () {
    const errEl = document.getElementById('sig-error');
    if (!sigHasContent) { errEl.textContent = '서명을 먼저 그려주세요.'; errEl.hidden = false; return; }
    const btn = document.getElementById('sig-submit-btn');
    btn.disabled = true;
    showLoading(true);
    const base64 = document.getElementById('sig-canvas').toDataURL('image/png').split(',')[1];
    try {
      if (sigModalKind === 'start' || sigModalKind === 'end') {
        const res = await fetch(`${FUNC_URL}/saveQrSignature`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            kakaoId: String(kakaoId), sessionId: currentSessionId, type: sigModalKind, signature: base64,
            // 조퇴로 시작한 종료 서명이면 그 사실과 인정 세션을 같이 보낸다.
            ...(sigModalKind === 'end' && earlyLeavePeriod !== null
              ? { earlyLeave: true, earlyLeavePeriod }
              : {}),
          }),
        }).then(r => r.json());
        if (!res.success) throw new Error(res.message || '저장 실패');
        const wasEarlyLeave = sigModalKind === 'end' && earlyLeavePeriod !== null;
        showToast(sigModalKind === 'start' ? '시작 서명 완료 ✓'
          : (wasEarlyLeave ? '조퇴 처리되었습니다 ✓' : '종료 서명 완료 ✓'), 'success');
        document.getElementById('sig-modal').hidden = true;
        sigModalKind = null;
        earlyLeavePeriod = null;
        await loadRosterStatus();
      } else if (sigModalKind === 'makeup') {
        const res = await fetch(`${FUNC_URL}/submitMakeupRequest`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ kakaoId: String(kakaoId), sessionId: currentSessionId, period: makeupRequest.period, signature: base64 }),
        }).then(r => r.json());
        if (!res.success) throw new Error(res.message || '제출 실패');
        makeupRequest = null;
        renderMakeupBanner();
        document.getElementById('sig-modal').hidden = true;
        sigModalKind = null;
        showToast('제출 완료! 관리자 승인을 기다려주세요.', 'success');
      }
    } catch (e) {
      errEl.textContent = '저장 실패: ' + e.message;
      errEl.hidden = false;
    } finally {
      showLoading(false);
      btn.disabled = false;
    }
  };

  async function loadRosterStatus() {
    if (!currentSessionId) { rosterStatus = null; renderSignaturePreviews(); return; }
    try {
      const snap = await getDoc(doc(db, 'sessions', currentSessionId, 'roster', String(kakaoId)));
      rosterStatus = snap.exists() ? snap.data() : null;
      renderSignaturePreviews();
      renderCheckins();   // 마지막 줄을 '교육종료'로 바꿀지가 rosterStatus에 달려 있다
      checkAutoSignature();
    } catch (e) {
      console.warn('서명 상태 조회 실패:', e);
    }
  }

  // QR 스캔 카드 왼쪽의 시작/종료 서명 미리보기 — rosterStatus.startSignature/endSignature는
  // base64 PNG 문자열(data: 접두사 없음)이라 그대로 <img src="data:image/png;base64,...">로 표시한다.
  function renderSignaturePreviews() {
    const startEl = document.getElementById('sig-preview-start');
    const endEl = document.getElementById('sig-preview-end');
    if (!startEl || !endEl) return;
    const startSig = rosterStatus && rosterStatus.startSignature;
    const endSig = rosterStatus && rosterStatus.endSignature;
    // 서명이 끝나면 서명 위에 '서명완료' 도장 — 도장이 없으면 아직 안 한 것이다.
    const sigBody = (sig) => sig
      ? `<img src="data:image/png;base64,${sig}"><span class="sig-stamp done">서명<br>완료</span>`
      : '';
    startEl.innerHTML = sigBody(startSig);
    endEl.innerHTML = sigBody(endSig);

    // 조퇴 버튼은 '출석 중이고 아직 종료 서명 전'일 때만 — 이미 서명했으면 나갈 일이 없고,
    // 한 번도 안 찍었으면 인정받을 세션 자체가 없다.
    const earlyLeft = !!(rosterStatus && rosterStatus.earlyLeaveAt);
    const btn = document.getElementById('btn-early-leave');
    if (btn) btn.hidden = earlyLeft || !(checkins.length > 0 && !endSig);
    // 조퇴취소는 조퇴 상태일 때만 — 조퇴하기와 항상 교대로만 보인다.
    const cancelBtn = document.getElementById('btn-cancel-early-leave');
    if (cancelBtn) cancelBtn.hidden = !earlyLeft;
  }

  // p세션은 앞(p)과 뒤(p+1) 지점을 모두 찍어야 이수 — 출석현황 표와 같은 규칙을 쓴다.
  function completedPeriods() {
    const has = (p) => checkins.some(x => x.period === p);
    const done = [];
    for (let p = 1; p <= 30; p++) if (has(p) && has(p + 1)) done.push(p);
    return done;
  }

  // 미완료 서명 자동 오픈 — rosterStatus(서버 상태)만 기준으로 삼는다. 방금 스캔했든,
  // 서명 전에 페이지를 나갔다가 다시 돌아왔든 동일하게 반응한다(QrMainScreen.js의
  // "미완료 서명 자동 오픈" effect와 같은 규칙).
  function checkAutoSignature() {
    if (!document.getElementById('sig-modal').hidden) return; // 이미 모달 떠 있음
    if (!rosterStatus) return;
    if (rosterStatus.startScannedAt && !rosterStatus.startSignedAt) {
      openSignatureModal('start', '시작 서명', false);
    } else if (rosterStatus.endScannedAt && !rosterStatus.endSignedAt) {
      openSignatureModal('end', '종료 서명', false);
    }
  }

  // ── 조퇴 ──
  window.openEarlyLeave = function () {
    const done = completedPeriods();
    const body = document.getElementById('early-leave-body');
    body.innerHTML = done.length
      ? `<div class="el-chips">${done.map(p => `<span class="el-chip">${p}세션</span>`).join('')}</div>`
        + `<div class="el-note"><b>${done[done.length - 1]}세션</b>까지만 인정됩니다.</div>`
      : '<div class="el-note el-none">아직 이수 완료된 세션이 없습니다.<br>지금 조퇴하면 인정되는 세션이 없습니다.</div>';
    document.getElementById('early-leave-modal').hidden = false;
  };

  window.closeEarlyLeave = function () {
    document.getElementById('early-leave-modal').hidden = true;
  };

  // 조퇴해도 그때까지를 인정받으려면 종료 서명이 있어야 한다 — 확인 후 바로 서명으로 넘긴다.
  // 이 서명이 '조퇴'임을 표시해 두면, 관리자 화면에서 미체크가 아니라 조퇴로 분류된다.
  window.confirmEarlyLeave = function () {
    const done = completedPeriods();
    earlyLeavePeriod = done.length ? done[done.length - 1] : 0;
    closeEarlyLeave();
    openSignatureModal('end', '종료 서명 (조퇴)', false);
  };

  // ── 조퇴취소 — 실수/변심으로 되돌릴 때. 종료 서명을 지워야 다시 조퇴하기가 뜬다. ──
  window.openCancelEarlyLeave = function () {
    document.getElementById('cancel-early-leave-modal').hidden = false;
  };

  window.closeCancelEarlyLeave = function () {
    document.getElementById('cancel-early-leave-modal').hidden = true;
  };

  window.confirmCancelEarlyLeave = async function () {
    const btn = document.getElementById('btn-cancel-early-leave-confirm');
    await withBusy(btn, '취소하는 중', async () => {
      try {
        await updateDoc(doc(db, 'sessions', currentSessionId, 'roster', String(kakaoId)), {
          earlyLeaveAt: deleteField(),
          earlyLeavePeriod: deleteField(),
          endSignature: deleteField(),
          endSignedAt: deleteField(),
        });
        closeCancelEarlyLeave();
        showToast('조퇴가 취소되었습니다 ✓', 'success');
        await Promise.all([loadRosterStatus(), loadCheckins()]);
      } catch (e) {
        showToast('조퇴취소 실패: ' + e.message, 'error');
      }
    });
  };

  // ── 구제요청(서명출석) 배너 ──
  async function loadMakeupRequests() {
    if (!currentSessionId) { makeupRequest = null; renderMakeupBanner(); return; }
    try {
      const q = query(
        collection(db, 'sessions', currentSessionId, 'makeupRequests'),
        where('kakaoId', '==', String(kakaoId)),
        where('status', '==', 'pending')
      );
      const snap = await getDocs(q);
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      makeupRequest = list[0] || null;
      renderMakeupBanner();
    } catch (e) {
      console.warn('서명요청 조회 실패:', e);
    }
  }

  function renderMakeupBanner() {
    const el = document.getElementById('makeup-banner');
    if (!makeupRequest) { el.hidden = true; return; }
    el.hidden = false;
    document.getElementById('makeup-banner-text').textContent =
      `${makeupRequest.period}세션 출석 서명요청이 도착했어요. 탭해서 서명해주세요`;
  }

  window.openMakeupSignature = function () {
    if (!makeupRequest) return;
    openSignatureModal('makeup', '서명출석', true);
  };

  // ── 오늘의 시간표(참고 표시 전용) ──
  async function loadSchedule() {
    if (!currentSessionId) { renderSchedule(null); return; }
    try {
      const sessSnap = await getDoc(doc(db, 'sessions', currentSessionId));
      if (!sessSnap.exists()) { renderSchedule(null); return; }
      const { orgId, date, orgName } = sessSnap.data();
      // 이미 읽은 세션 문서에서 학회명을 꺼내 이름 옆에 보인다(아직 한 번도 안 찍었으면 숨김).
      const orgEl = document.getElementById('student-org-label');
      orgEl.textContent = orgName || '';
      orgEl.hidden = !orgName;
      if (!orgId || !date) { renderSchedule(null); return; }
      const schedSnap = await getDoc(doc(db, 'schedule', `${orgId}_${date}`));
      renderSchedule(schedSnap.exists() ? (schedSnap.data().courses || []) : null);
    } catch (e) {
      console.warn('시간표 조회 실패:', e);
      renderSchedule(null);
    }
  }

  function renderSchedule(courses) {
    const el = document.getElementById('schedule-card-body');
    if (!courses || !courses.length) { el.innerHTML = '<div class="empty-text">참고용 시간표가 없습니다.</div>'; return; }
    el.innerHTML = courses.map(c => `
      <div class="schedule-row">
        <span class="schedule-time">${escapeHtml(c.time || '')}</span>
        <div class="schedule-info">
          <div class="schedule-title">${escapeHtml(c.title || '')}</div>
          <div class="schedule-sub">${escapeHtml(c.instructor || '')}${c.affiliation ? ' · ' + escapeHtml(c.affiliation) : ''}</div>
        </div>
      </div>
    `).join('');
  }

  // ── 토스트/로딩/시간팝업 ──
  let toastTimer = null;
  function showToast(message, type) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.className = 'toast toast-' + (type || 'info');
    el.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2500);
  }

  let timePopupTimer = null;
  // period p의 스캔 지점은 "(p-1)세션과 p세션 사이" — p=1이면 교육 시작 전이다.
  function scanPointLabel(p) {
    if (!p) return '출석';
    return p === 1 ? '교육 시작 전' : `${p - 1}세션 완료`;
  }
  function showTimePopup(timeText, period, kind) {
    const el = document.getElementById('time-popup');
    document.getElementById('time-popup-where').textContent = scanPointLabel(period);
    document.getElementById('time-popup-text').textContent = timeText;
    document.getElementById('time-popup-note').textContent =
      kind === 'duplicate' ? '이미 처리 된 QR입니다' : '출석 인정되었습니다';
    el.classList.toggle('dup', kind === 'duplicate');
    el.hidden = false;
    el.classList.remove('time-popup-show');
    if (timePopupTimer) clearTimeout(timePopupTimer);
    // 연속 스캔 시 애니메이션을 처음부터 다시 재생시키기 위한 강제 리플로우
    void el.offsetWidth;
    el.classList.add('time-popup-show');
    timePopupTimer = setTimeout(() => { el.hidden = true; }, 2200);
  }

  function showLoading(v) {
    document.getElementById('loading-overlay').hidden = !v;
  }

  // 카카오에서 돌아온 직후(code)나 저장된 로그인이 있을 때는 처리가 끝날 때까지 로그인
  // 화면이 그대로 보여 멈춘 것처럼 느껴진다 — 끝날 때까지 어둡게 덮어 버튼을 못 누르게 한다.
  if (new URLSearchParams(window.location.search).get('code') || localStorage.getItem('ce_kakao_id')) showLoading(true);
  boot().finally(() => showLoading(false));

  // 카카오 화면에서 '뒤로'로 돌아오면 이전 상태 그대로 복원돼 로딩이 영원히 남는다.
  window.addEventListener('pageshow', (e) => { if (e.persisted) showLoading(false); });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme: light;
  --brand: #5a5ac4;
  --brand-dark: #45469e;
  --brand-xlight: #ece5fb;
  --canvas: #e0d7fb;
  --subtle: #f4f3f8;   /* 칩·목록의 중립 채움(페이지 배경과 구분) */
  --surface: #FFFFFF;
  --border: #ddd5ee;
  --text: #1b1b1b;
  --muted: #6b6b76;
  --pill: 50px;
  --shadow: 0 2px 10px rgba(27,27,27,.06), 0 0 0 1px rgba(27,27,27,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
/* 화면 위·아래로 당기거나 주소창 뒤로 비치는 부분은 body 색이다 — 메인 화면이 흰색이라
   같은 흰색으로 맞춰 경계가 안 보이게 한다. */
html{background:#fff;}
body{font-family:'Pretendard',system-ui,sans-serif;background:#fff;color:var(--text);letter-spacing:-0.01em;min-height:100vh;}
[hidden]{display:none!important;}

.screen{min-height:100vh;}
#login-screen,#registration-screen{background:linear-gradient(160deg,#e0d7fb 0%,#f7f1fe 100%);display:flex;align-items:center;justify-content:center;padding:24px;}

.auth-card{background:var(--surface);border-radius:20px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,0.3);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo-mark{width:72px;height:72px;border-radius:20px;display:block;object-fit:cover;margin:0 auto 14px;box-shadow:0 3px 12px rgba(27,27,27,.14);}
.auth-logo-title{font-size:22px;font-weight:800;color:var(--text);margin-top:8px;letter-spacing:-0.02em;}
.auth-logo-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.auth-form-label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase;}
.auth-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);outline:none;margin-bottom:14px;background:#fff;}
.auth-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(108,99,255,.12);}
/* 눌렀을 때 즉시 반응이 있어야 학생이 '눌렸나?' 하며 다시 누르지 않는다.
   :active는 손가락이 닿는 순간 바로 먹히고, is-busy는 요청이 도는 동안 유지된다. */
.auth-btn{width:100%;padding:15px;border-radius:var(--pill);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s ease,filter .12s ease,opacity .12s ease;}
.auth-btn:active:not(:disabled){transform:scale(.97);filter:brightness(.93);}
.auth-btn:disabled{cursor:not-allowed;opacity:.65;}
.auth-btn.is-busy::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:btnDots 1s steps(4,end) infinite;}
@keyframes btnDots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
.auth-btn-primary{background:var(--brand);color:#fff;}
.auth-btn-secondary{background:#f1f5f9;color:#374151;}
.auth-btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
/* 가입 입력칸은 손가락으로 누르기 쉽게 크게. 인증번호 줄은 재전송 버튼(작게)이 입력칸 왼쪽에 붙는다. */
.reg-input{padding:18px 18px;font-size:20px;}
.reg-otp-line{display:flex;gap:8px;align-items:stretch;}
.reg-otp-line .reg-input{flex:1;min-width:0;width:auto;margin:0;}
.reg-resend-btn{flex:0 0 auto;padding:0 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--subtle);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;}
.reg-resend-btn:disabled{opacity:.6;cursor:not-allowed;}
.auth-btn-primary:hover{background:var(--brand-dark);}
.auth-error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
.kakao-btn{width:100%;padding:15px;border-radius:var(--pill);border:none;font-size:15px;font-weight:700;cursor:pointer;background:#FEE500;color:#191600;}

/* ── 메인 화면 ── */
/* 로그인 이후 메인 화면은 위아래까지 전부 흰 바탕 — 라벤더는 로그인/가입 화면에만 둔다. */
#main-screen{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:24px;background:#fff;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);}
.topbar-title{font-size:24px;font-weight:800;color:var(--brand);}
.topbar-date{font-size:14px;font-weight:700;color:var(--muted);margin-top:2px;}
.btn-logout{background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:var(--pill);cursor:pointer;font-size:12px;font-weight:600;}

.makeup-banner{margin:14px 16px 0;background:#fef3c7;border:1px solid #fcd34d;border-radius:14px;padding:14px;cursor:pointer;}
.makeup-banner span{font-size:13px;font-weight:700;color:#92400e;display:block;text-align:center;}

.card{background:var(--surface);margin:14px 16px 0;border-radius:14px;padding:16px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:800;color:var(--brand);margin-bottom:12px;}
/* 카드 맨 위 왼쪽에 이름, 그 아래에 [시작/종료 서명 | QR 스캔] 한 줄. */
.qr-scan-card{display:flex;flex-direction:column;gap:12px;}
.qr-scan-row{display:flex;gap:12px;}
/* 이름은 알약 없이 큰 검은 글씨, QR을 찍은 학회명만 연보라 알약(보라 글씨). 학회명은 길면 줄임표로 자른다. */
.student-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.student-name{font-size:28px;font-weight:800;color:var(--text);line-height:1.2;}
.student-org{background:var(--brand-xlight);color:var(--brand);border-radius:var(--pill);padding:7px 16px;font-size:16px;font-weight:800;line-height:1.3;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sig-preview-col{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}
.sig-preview-box{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.sig-preview-header{padding:6px 10px;font-size:12px;font-weight:700;}
.sig-preview-header-start{background:#eef2ff;color:#4338ca;}
.sig-preview-header-end{background:#fef2f2;color:#b91c1c;}
.sig-preview-body{height:64px;display:flex;align-items:center;justify-content:center;background:#fafaff;}
/* 조퇴 — 되돌리기 어려운 동작이라 붉은 톤으로, 다만 오인 클릭을 부르지 않게 작게 둔다. */
.early-leave-btn{width:100%;border:none;border-top:1px solid #fecaca;background:#fef2f2;color:#b91c1c;padding:9px 0;font-size:13px;font-weight:800;cursor:pointer;}
.early-leave-btn:hover{background:#fee2e2;}
/* 조퇴취소 — 조퇴하기와 같은 자리·크기를 쓰되, 되돌리는 동작임을 파란 톤으로 구분한다. */
/* 조퇴 취소는 "아직 되돌릴 수 있다"를 알리는 버튼 — 종료 서명 제목 글자색(#b91c1c)으로
   채우고 글자는 흰색으로 둔다. */
.cancel-early-leave-btn{border-top-color:#b91c1c;background:#b91c1c;color:#fff;}
.cancel-early-leave-btn:hover{background:#991b1b;}
.early-leave-card{gap:14px;}
.early-leave-body{text-align:center;}
.el-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
.el-chip{background:#ede9fe;color:var(--brand);border:1.5px solid #bcaef0;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:800;}
.el-note{font-size:15px;font-weight:700;color:var(--text);line-height:1.5;}
.el-note b{color:#b91c1c;font-size:18px;}
.el-none{color:var(--muted);font-weight:600;font-size:14px;}
.early-leave-btns{display:flex;gap:10px;}
.early-leave-btns .auth-btn{flex:1;margin:0;}
.early-leave-cancel{background:var(--subtle);color:var(--text);border:1.5px solid var(--border);}
.early-leave-go{background:#b91c1c;color:#fff;border:none;}
.cancel-early-leave-go{background:#1d4ed8;}
.sig-preview-body img{max-height:100%;max-width:100%;object-fit:contain;}
/* 진한 단색은 너무 튀어서 연한 브랜드 톤으로 낮추고, 카메라 아이콘은 크게 키운다. */
.qr-scan-btn{flex-shrink:0;width:110px;background:var(--brand-xlight);color:var(--brand);border:1.5px solid #bcaef0;border-radius:16px;font-size:14px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;line-height:1.3;}
.qr-scan-btn .qr-scan-icon{font-size:38px;line-height:1;}
.qr-scan-btn:hover{background:#ddd2f7;}
.qr-scan-btn,.early-leave-btn{transition:transform .08s ease,filter .12s ease;}
.qr-scan-btn:active,.early-leave-btn:active{transform:scale(.97);filter:brightness(.94);}

.empty-text{font-size:13px;color:var(--muted);}

/* ── 출석현황 세로 타임라인(관리자 화면 .tl-* 디자인을 세로로 변형) ── */
.ck-table{display:flex;flex-direction:column;gap:6px;}
/* 출석현황 — [세션 | 시작 | 종료] 표. 세션 사이에 찍는 QR 한 번은 앞 세션의 '종료'이자 다음 세션의 '시작'이라
   두 칸에 같은 시각이 들어간다 — "다음 세션 시작도 이미 찍었구나"가 읽히게 하려는 것이다.
   찍힌 칸은 QR 스캔 버튼(.qr-scan-btn)과 같은 연보라(중간에 놓친 칸도 뒤에 찍은 시각으로 채운다), 아직 안 온 칸은 회색 점선. */
.ck-head,.ck-row{display:grid;grid-template-columns:84px 1fr 1fr;gap:6px;align-items:stretch;}
.ck-head span{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding-bottom:2px;}
.ck-session{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;color:var(--muted);background:#fafafc;border:1.5px solid var(--border);border-radius:14px;padding:8px 4px;}
/* 종료까지 찍어 이수된 세션만 색을 채운다 — 어디까지 인정됐는지 한눈에 보이도록. */
.ck-session.done{background:var(--brand-xlight);border-color:#bcaef0;color:var(--brand);}
.ck-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 6px;min-width:0;border-radius:14px;border:1.5px solid var(--border);background:#fafafc;color:var(--muted);font-size:15px;font-weight:800;white-space:nowrap;}
.ck-cell.done{background:var(--brand-xlight);border-color:#bcaef0;color:var(--brand);}
.ck-cell.wait{border-style:dashed;font-weight:700;}
.ck-cell.left{background:#b91c1c;border-color:#b91c1c;color:#fff;}
.ck-sub{font-size:10px;font-weight:700;opacity:.8;}
/* 마지막 줄 — 교육이 끝났다는 걸 붉게 채워 보여준다. */
.ck-final{text-align:center;background:#b91c1c;color:#fff;border-radius:14px;padding:10px;font-size:14px;font-weight:800;}
.ck-note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:2px;}
/* 이수완료는 붉은 도장처럼 — 살짝 기울여 찍은 느낌을 준다. */
.ck-stamp{color:#dc2626;border:2px solid #dc2626;border-radius:5px;padding:1px 4px;font-size:10px;font-weight:900;letter-spacing:.5px;line-height:1.25;white-space:nowrap;transform:rotate(-7deg);}

/* 서명 박스 — 서명이 끝나면 서명 위에 둥근 '서명완료' 도장이 찍힌다(도장이 없으면 아직 안 한 것). */
.sig-preview-body{position:relative;}
.sig-stamp{position:absolute;right:10px;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:900;line-height:1.15;transform:rotate(-12deg);pointer-events:none;}
.sig-stamp.done{color:#dc2626;border:2.5px solid #dc2626;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(220,38,38,.18);}

.schedule-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--subtle);}
.schedule-row:last-child{border-bottom:none;}
.schedule-time{flex-shrink:0;width:82px;font-size:12px;font-weight:700;color:var(--brand);}
.schedule-title{font-size:13px;font-weight:700;color:var(--text);}
.schedule-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── QR 스캔 오버레이 ── */
.scan-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;overflow:hidden;}
.scan-hint{position:absolute;top:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7);padding:0 16px;}
.scan-zoom-row{position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:center;gap:10px;}
.scan-zoom-btn{min-width:60px;padding:11px 16px;border-radius:var(--pill);border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.4);color:#fff;font-size:17px;font-weight:800;cursor:pointer;}
.scan-zoom-btn.on{background:#fff;color:#111;border-color:#fff;}
#qr-video{flex:1;width:100%;object-fit:cover;}
.scan-close-btn{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.25);color:#fff;border:none;border-radius:var(--pill);padding:12px 32px;font-size:14px;font-weight:700;cursor:pointer;}

/* ── 서명 모달 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:300;}
.sig-card{background:#fff;width:100%;max-width:480px;border-top-left-radius:24px;border-top-right-radius:24px;padding:20px;padding-bottom:32px;}
.sig-handle{width:36px;height:4px;background:#e5e7eb;border-radius:2px;margin:0 auto 14px;}
.sig-title{font-size:17px;font-weight:800;color:#1a1a2e;text-align:center;}
.sig-subtitle{font-size:12px;color:#94a3b8;text-align:center;margin-top:4px;margin-bottom:14px;}
.sig-pad-wrap{position:relative;height:220px;border:1.5px solid #bcaef0;border-radius:12px;overflow:hidden;background:#fafaff;}
#sig-canvas{width:100%;height:100%;touch-action:none;display:block;}
.sig-btn-row{display:flex;gap:10px;margin-top:14px;}
.sig-clear-btn{background:#f1f5f9;color:#374151;border:none;border-radius:12px;padding:14px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.sig-submit-btn{flex:1;}
.sig-later-btn{display:block;width:100%;background:none;border:none;color:#94a3b8;font-size:13px;font-weight:600;text-align:center;margin-top:12px;text-decoration:underline;cursor:pointer;}

.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:400;}
.loading-box{background:#fff;border-radius:16px;padding:24px 32px;font-size:14px;font-weight:700;color:#334155;display:flex;flex-direction:column;align-items:center;gap:14px;}
.loading-spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--subtle,#f4f3f8);border-top-color:var(--brand);animation:loadingSpin .7s linear infinite;}
@keyframes loadingSpin{to{transform:rotate(360deg);}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:var(--pill);font-size:13px;font-weight:600;z-index:500;max-width:88vw;text-align:center;}
.toast-error{background:#B91C1C;}
.toast-success{background:#16a34a;}

/* ── 시간 팝업 애니메이션 ── */
.time-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--brand);color:#fff;padding:26px 40px;border-radius:20px;z-index:600;pointer-events:none;opacity:0;box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center;}
.time-popup.dup{background:#b91c1c;}
.time-popup-where{font-size:17px;font-weight:700;opacity:.9;margin-bottom:2px;}
.time-popup-text{font-size:56px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;}
.time-popup-note{font-size:15px;font-weight:700;opacity:.9;margin-top:4px;}
/* 2.2s는 showTimePopup()의 숨김 타이머와 맞춘 값이다(둘이 어긋나면 빈 상자가 남는다). */
.time-popup.time-popup-show{animation:timePopupAnimate 2.2s ease-in-out forwards;}
@keyframes timePopupAnimate{0%{opacity:0;transform:translate(-50%,-50%) scale(0.7);}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06);}20%{transform:translate(-50%,-50%) scale(1);}85%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(0.9);}}
</style>
</head>
<body>

<div id="login-screen" class="screen">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-mark" src="here-icon.png" alt="Here">
      <div class="auth-logo-title">연수교육 QR 인증</div>
      <div class="auth-logo-sub">학생 로그인</div>
    </div>
    <div class="auth-error" id="login-error" hidden></div>
    <button class="kakao-btn" onclick="doKakaoLogin()">카카오로 로그인</button>
  </div>
</div>

<div id="registration-screen" class="screen" hidden>
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-mark" src="here-icon.png" alt="Here">
      <div class="auth-logo-title">회원가입</div>
      <div class="auth-logo-sub">이름과 휴대폰 인증만 하면 돼요</div>
    </div>
    <div class="auth-error" id="reg-error" hidden></div>
    <label class="auth-form-label">이름</label>
    <input class="auth-input reg-input" id="reg-name" type="text" placeholder="이름">
    <label class="auth-form-label">휴대폰번호</label>
    <input class="auth-input reg-input" id="reg-phone" type="tel" inputmode="numeric" oninput="onRegPhoneInput()">
    <button class="auth-btn auth-btn-secondary" id="btn-request-otp" onclick="requestRegOtp(this)">인증번호 받기</button>
    <div id="reg-otp-row" hidden>
      <label class="auth-form-label">인증번호</label>
      <div class="reg-otp-line">
        <button class="reg-resend-btn" id="btn-resend-otp" onclick="requestRegOtp(this)">재전송</button>
        <input class="auth-input reg-input" id="reg-otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="인증번호 6자리" oninput="onRegOtpInput()">
      </div>
    </div>
  </div>
</div>

<div id="main-screen" class="screen" hidden>
  <div class="topbar">
    <div>
      <div class="topbar-title">연수교육</div>
      <div class="topbar-date" id="topbar-date"></div>
    </div>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <div id="makeup-banner" class="makeup-banner" hidden onclick="openMakeupSignature()">
    <span id="makeup-banner-text"></span>
  </div>

  <div class="card qr-scan-card">
    <div class="student-head">
      <span class="student-name" id="student-name-label"></span>
      <span class="student-org" id="student-org-label" hidden></span>
    </div>
    <div class="qr-scan-row">
    <div class="sig-preview-col">
      <div class="sig-preview-box">
        <div class="sig-preview-header sig-preview-header-start">시작 서명</div>
        <div class="sig-preview-body" id="sig-preview-start"><span class="empty-text">대기중</span></div>
      </div>
      <div class="sig-preview-box">
        <div class="sig-preview-header sig-preview-header-end">종료 서명</div>
        <div class="sig-preview-body" id="sig-preview-end"><span class="empty-text">대기중</span></div>
        <!-- 세션이 끝나기 전에 나가는 학생용 — 여기서 종료 서명을 해야 그때까지가 인정된다. -->
        <button class="early-leave-btn" id="btn-early-leave" hidden onclick="openEarlyLeave()">조퇴하기</button>
        <!-- 조퇴 후 마음이 바뀐 학생용 — 조퇴하기와 같은 자리·크기, 서로 교대로만 보인다. -->
        <button class="early-leave-btn cancel-early-leave-btn" id="btn-cancel-early-leave" hidden onclick="openCancelEarlyLeave()">조퇴 취소</button>
      </div>
    </div>
    <button class="qr-scan-btn" onclick="openScanner()"><span class="qr-scan-icon">📷</span>QR 스캔</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">출석현황</div>
    <div id="checkin-list" class="ck-table"><div class="empty-text">아직 체크한 세션이 없습니다.</div></div>
  </div>

  <div class="card">
    <div class="card-title">오늘의 시간표</div>
    <div id="schedule-card-body"><div class="empty-text">참고용 시간표가 없습니다.</div></div>
  </div>
</div>

<!-- 조퇴 확인 — 실수로 누를 수 있으니 무엇까지 인정되는지 보여주고 한 번 더 묻는다. -->
<div id="early-leave-modal" class="modal-overlay" hidden>
  <div class="sig-card early-leave-card">
    <div class="sig-title">정말 조퇴 하시겠습니까?</div>
    <div class="early-leave-body" id="early-leave-body"></div>
    <div class="early-leave-btns">
      <button class="auth-btn early-leave-cancel" onclick="closeEarlyLeave()">취소</button>
      <button class="auth-btn early-leave-go" onclick="confirmEarlyLeave()">조퇴하기</button>
    </div>
  </div>
</div>

<!-- 조퇴취소 확인 — 기존 조퇴 확인창과 동일한 모양새, 되돌리는 동작임을 문구로만 구분. -->
<div id="cancel-early-leave-modal" class="modal-overlay" hidden>
  <div class="sig-card early-leave-card">
    <div class="sig-title">조퇴를 취소하고 계속 수강하시겠습니까?</div>
    <div class="early-leave-btns">
      <button class="auth-btn early-leave-cancel" onclick="closeCancelEarlyLeave()">취소</button>
      <button class="auth-btn early-leave-go cancel-early-leave-go" id="btn-cancel-early-leave-confirm" onclick="confirmCancelEarlyLeave()">조퇴 취소</button>
    </div>
  </div>
</div>

<div id="scan-overlay" class="scan-overlay" hidden>
  <video id="qr-video" playsinline autoplay muted></video>
  <canvas id="qr-canvas-hidden" hidden></canvas>
  <div class="scan-hint">멀리 있는 QR은 아래 확대 버튼을 눌러 맞춰주세요</div>
  <div class="scan-zoom-row">
    <button class="scan-zoom-btn on" data-z="1" onclick="setScanZoom(1)">1×</button>
    <button class="scan-zoom-btn" data-z="2" onclick="setScanZoom(2)">2×</button>
    <button class="scan-zoom-btn" data-z="3" onclick="setScanZoom(3)">3×</button>
  </div>
  <button class="scan-close-btn" onclick="closeScanner()">닫기</button>
</div>

<div id="sig-modal" class="modal-overlay" hidden>
  <div class="sig-card">
    <div class="sig-handle"></div>
    <div class="sig-title" id="sig-title"></div>
    <div class="sig-subtitle">서명을 완료해야 다음으로 넘어갈 수 있어요.</div>
    <div class="sig-pad-wrap">
      <canvas id="sig-canvas"></canvas>
    </div>
    <div class="auth-error" id="sig-error" hidden></div>
    <div class="sig-btn-row">
      <button class="sig-clear-btn" onclick="clearSignature()">지우기</button>
      <button class="auth-btn auth-btn-primary sig-submit-btn" id="sig-submit-btn" onclick="submitSignatureModal()">제출</button>
    </div>
    <button class="sig-later-btn" id="sig-later-btn" hidden onclick="closeSignatureModal()">나중에 하기</button>
  </div>
</div>

<div id="loading-overlay" class="loading-overlay" hidden>
  <div class="loading-box"><div class="loading-spinner"></div>확인 중...</div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- 스캔 직후 결과를 크게 띄운다. 일반 카메라로 찍으면 처리가 순식간이라
     제대로 찍혔는지 알기 어려워서, 시각뿐 아니라 "어느 지점을 찍었는지"까지 보여준다. -->
<div id="time-popup" class="time-popup" hidden>
  <div class="time-popup-where" id="time-popup-where">1세션 전</div>
  <div class="time-popup-text" id="time-popup-text">09:30</div>
  <div class="time-popup-note" id="time-popup-note">출석 인정</div>
</div>

</body>
</html>
