<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연수교육 QR 인증 — 관리자</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, query, where, getDocs, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  // 로그인한 계정(uid)의 admins 문서에서 orgId를 조회해 채운다(onAuthStateChanged 참고).
  // qr-admin의 ACADEMY_ID/academyName과 동일한 역할, 이름만 치환(academyId→orgId).
  let ORG_ID = null;
  let orgName = '';

  const FUNC_URL = 'https://us-central1-yeonsu-qr-auth.cloudfunctions.net';

  const app = initializeApp({
    projectId: "yeonsu-qr-auth",
    appId: "1:1001009945495:web:9f99c789e6d13404a442d2",
    storageBucket: "yeonsu-qr-auth.firebasestorage.app",
    apiKey: "AIzaSyA68rFB5yLol3v9acbwRIFPtDdX2hf2FQw",
    authDomain: "yeonsu-qr-auth.firebaseapp.com",
    messagingSenderId: "1001009945495",
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  // 로그인 전(가입 화면의 기관 검색)에도 Firestore를 읽어야 해서 익명으로 먼저 로그인해둔다
  // (보안규칙이 request.auth != null 공통 패턴 — mobile-app/qr-admin과 동일). 실제 관리자가
  // 이메일/비밀번호로 로그인·가입하면 이 익명 세션은 그 계정으로 자연스럽게 교체된다.
  signInAnonymously(auth).catch(e => console.warn('익명 로그인 실패:', e));

  // ── 상태 ──
  let currentPeriod = null;
  let maxPeriod = 0;
  let isFinalPeriod = false;
  // 타임라인에서 🏁(교육 종료) 지점을 그리려면 "몇 교시가 마지막인지" 번호 자체가 필요하다
  // (isFinalPeriod는 "지금 보고 있는 교시가 마지막인가"만 알려줘서, 이전 교시로 이동하면
  // 정보가 사라진다). 세션 문서의 finalPeriod를 그대로 들고 있는다.
  let finalPeriodNum = null;
  let rotateInterval = null;
  let countdownInterval = null;
  let countdownSec = 5;
  let rosterUnsub = null;
  let checkinsUnsub = null;
  let sessionUnsub = null;
  let makeupRequestsUnsub = null;
  let periodCountsUnsub = null;

  function todayKST() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  }

  function sessionId() {
    return `${ORG_ID}_${todayKST()}`;
  }

  function clearRotateInterval() {
    if (rotateInterval) { clearInterval(rotateInterval); rotateInterval = null; }
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  }

  window.addEventListener('beforeunload', clearRotateInterval);

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── 로그인 ──
  window.doLogin = async function () {
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-pw').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      // 이후 처리는 onAuthStateChanged 리스너가 전담한다.
    } catch (e) {
      errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
      errEl.style.display = 'block';
    }
  };

  window.doLogout = async function () {
    clearRotateInterval();
    if (rosterUnsub) rosterUnsub();
    if (checkinsUnsub) checkinsUnsub();
    if (periodCountsUnsub) { periodCountsUnsub(); periodCountsUnsub = null; }
    if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
    if (makeupRequestsUnsub) { makeupRequestsUnsub(); makeupRequestsUnsub = null; }
    stopRosterPoll();
    await auth.signOut();
    ORG_ID = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('auth-wrap').style.display = 'flex';
    // 로그아웃 후에도 가입 화면의 기관 검색이 계속 동작하도록 익명 세션을 다시 세워둔다.
    signInAnonymously(auth).catch(e => console.warn('익명 로그인 실패:', e));
  };

  // ── 상단 탭(QR / 관리자) — 실시간 리스너가 끊기지 않도록 DOM에는 항상 두고 display만 토글 ──
  window.switchTab = function (tab) {
    document.getElementById('page-qr').style.display = tab === 'qr' ? '' : 'none';
    document.getElementById('page-admin').style.display = tab === 'admin' ? '' : 'none';
    document.getElementById('tab-btn-qr').classList.toggle('active', tab === 'qr');
    document.getElementById('tab-btn-admin').classList.toggle('active', tab === 'admin');
  };

  async function enterDashboard() {
    document.getElementById('auth-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    document.getElementById('org-name-label').textContent = orgName || '연수교육 QR 인증';
    document.getElementById('session-date').value = todayKST();
    startRosterListener();
    startPeriodCountsListener();
    startRosterPoll();
    loadAllOrgStudents(); // 출석 서명요청용 학생 선택 목록 — 로그인당 1회면 충분
    // 시간표는 세션 상태와 무관하게 orgId+오늘 날짜만으로 정해지므로 대시보드 진입 시
    // 스크래핑을 백그라운드로 돌려 대시보드 렌더를 막지 않는다(화면 표시는 학생 웹 전용).
    refreshTodaySchedule(false);
    await resumeIfInProgress();
  }

  // ── 회원가입 — 이메일/비밀번호 + 기관 검색·선택(자기가입, qr-admin의 OTP+CF 가입과 다름) ──
  let allOrgs = [];
  let selectedOrg = null; // { id, name }
  // 가입 처리 중 플래그 — doSignup과 onAuthStateChanged가 서로 경쟁하지 않게 한다.
  let signingUp = false;

  window.showSignup = function () {
    document.getElementById('auth-wrap').querySelector('.auth-card').style.display = 'none';
    document.getElementById('signup-card').style.display = 'block';
    if (!allOrgs.length) loadAllOrgs();
    loadOrgsFromKma(); // 백그라운드 — 실패해도 Firestore 캐시만으로 계속 가입 가능
  };

  window.showLoginFromSignup = function () {
    document.getElementById('signup-card').style.display = 'none';
    document.getElementById('auth-wrap').querySelector('.auth-card').style.display = 'block';
  };

  // orgs 컬렉션({name, updatedAt} 문서들) 전체를 페이지 로드 시 한 번 받아 배열로 들고
  // 있다가, 검색창 입력마다 이름 부분일치로 클라이언트에서 필터링한다(외부 라이브러리 없이
  // 순수 JS 자동완성).
  async function loadAllOrgs() {
    try {
      const snap = await getDocs(collection(db, 'orgs'));
      allOrgs = snap.docs.map(d => ({ id: d.id, name: d.data().name || d.id }));
    } catch (e) {
      console.warn('기관 목록 조회 실패:', e);
    }
  }
  loadAllOrgs();

  // 기관명을 문서ID로 쓰되 Firestore가 금지하는 문자만 안전하게 치환 — 서버(functions의
  // sanitizeOrgId)와 같은 규칙. 직접입력으로 새 기관을 등록할 때 이걸로 orgId를 만든다.
  function sanitizeOrgIdClient(name) {
    let id = String(name || '').trim().replace(/\//g, '_').replace(/\s+/g, ' ');
    id = id.replace(/^\.+/, '').replace(/\.+$/, '');
    if (!id) id = 'org_' + Math.random().toString(16).slice(2, 10);
    return id;
  }

  window.onOrgSearchInput = function () {
    const q = document.getElementById('signup-org-search').value.trim();
    selectedOrg = null;
    const dd = document.getElementById('signup-org-dropdown');
    if (!q) { dd.style.display = 'none'; dd.innerHTML = ''; return; }
    const matches = allOrgs.filter(o => o.name.includes(q)).slice(0, 30);
    let html = matches.map(o =>
      `<div class="org-option" data-id="${escapeHtml(o.id)}" data-name="${escapeHtml(o.name)}">${escapeHtml(o.name)}</div>`
    ).join('');
    // KMA 자동수집이 아직 안 됐거나 새로 생긴 기관이라 목록에 없을 수 있다 — 검색어와
    // 정확히 같은 이름이 이미 목록에 없으면, 그 이름 그대로 새 기관으로 바로 등록하는
    // 옵션을 항상 마지막에 보여준다(가입이 목록 상태에 막히지 않도록).
    const exactExists = allOrgs.some(o => o.name === q);
    if (!exactExists) {
      html += `<div class="org-option org-option-manual" data-manual="1" data-name="${escapeHtml(q)}">+ "${escapeHtml(q)}" 새 기관으로 등록</div>`;
    }
    dd.innerHTML = html;
    dd.style.display = 'block';
  };

  document.addEventListener('click', (e) => {
    const opt = e.target.closest('.org-option');
    if (opt) {
      if (opt.dataset.manual) {
        selectedOrg = { id: sanitizeOrgIdClient(opt.dataset.name), name: opt.dataset.name, isNew: true };
      } else {
        selectedOrg = { id: opt.dataset.id, name: opt.dataset.name };
      }
      document.getElementById('signup-org-search').value = selectedOrg.name;
      document.getElementById('signup-org-dropdown').style.display = 'none';
      return;
    }
    if (!e.target.closest('#signup-org-search') && !e.target.closest('#signup-org-dropdown')) {
      const dd = document.getElementById('signup-org-dropdown');
      if (dd) dd.style.display = 'none';
    }
  });

  window.doSignup = async function () {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-pw').value;
    const errEl = document.getElementById('signup-error');
    errEl.style.display = 'none';
    if (!email || !password) {
      errEl.textContent = '이메일과 비밀번호를 입력해주세요.';
      errEl.style.display = 'block';
      return;
    }
    if (!selectedOrg) {
      errEl.textContent = '기관을 검색해서 선택해주세요.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('btn-submit-signup');
    btn.disabled = true;
    // 가입 처리 중에는 onAuthStateChanged의 "admins 문서 없으면 자동 로그아웃" 경로를
    // 막는다 — 계정 생성 직후엔 admins 문서를 아직 쓰기 전이라, 이 가드가 없으면
    // 로그인 상태 감지기가 먼저 실행돼 방금 만든 계정을 그대로 로그아웃시켜버린다
    // (그 에러는 숨겨진 로그인 카드에 찍혀서 화면상 "아무 반응 없음"으로 보였다).
    signingUp = true;
    try {
      let uid;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        uid = cred.user.uid;
      } catch (e1) {
        if (e1 && e1.code === 'auth/email-already-in-use') {
          // 이전 시도에서 계정만 만들어지고 admins 문서가 안 남은 경우 복구 —
          // 같은 비밀번호로 로그인해서 그대로 이어서 진행한다.
          const cred2 = await signInWithEmailAndPassword(auth, email, password);
          uid = cred2.user.uid;
        } else {
          throw e1;
        }
      }
      // 검색 목록에 없던(직접입력) 기관이면 orgs에도 같이 등록해둬서 다음 관리자
      // 가입 때는 검색으로 바로 나오게 한다.
      if (selectedOrg.isNew) {
        await setDoc(doc(db, 'orgs', selectedOrg.id), {
          name: selectedOrg.name,
          updatedAt: serverTimestamp(),
        }, { merge: true });
      }
      await setDoc(doc(db, 'admins', uid), {
        orgId: selectedOrg.id,
        orgName: selectedOrg.name,
        email,
        createdAt: serverTimestamp(),
      }, { merge: true });
      ORG_ID = selectedOrg.id;
      orgName = selectedOrg.name;
      await enterDashboard();
    } catch (e) {
      errEl.textContent = '가입 실패: ' + (e && e.message ? e.message : e);
      errEl.style.display = 'block';
    } finally {
      signingUp = false;
      btn.disabled = false;
    }
  };

  // ── 실시간 QR ──
  async function authHeader() {
    const token = await auth.currentUser.getIdToken();
    return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  window.startNextPeriod = async function (final) {
    // final 경로의 확인은 confirmEndSession()의 전용 확인창이 담당한다(중복 확인 방지).
    const btn = document.getElementById(final ? 'btn-end-session' : 'btn-start-period');
    btn.disabled = true;
    try {
      const res = await fetch(`${FUNC_URL}/startQrPeriod`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({ date: document.getElementById('session-date').value, final: !!final })
      });
      if (!res.ok) throw new Error('요청 실패');
      const data = await res.json();
      currentPeriod = data.period;
      maxPeriod = data.maxPeriod || data.period;
      isFinalPeriod = !!final;
      if (final) finalPeriodNum = data.period; // 세션 리스너가 곧 덮어쓰지만 즉시 반영해둔다
      renderPeriodTabs();
      renderPeriodCounts();
      document.getElementById('session-date').disabled = true;
      document.getElementById('btn-end-session').style.display = 'inline-block';
      updateEndSessionBtn();
      drawQr(data.qrPayload);
      resubscribeCheckins();
      startSessionListener();
      startMakeupRequestsListener();
      startRotateLoop();
    } catch (e) {
      alert((final ? '교육 종료' : '교시 시작') + '에 실패했습니다: ' + e.message);
    } finally {
      if (!final || !isFinalPeriod) btn.disabled = false;
    }
  };

  window.handleNextPeriodClick = function () {
    if (currentPeriod && currentPeriod < maxPeriod) {
      window.switchToPeriod('next');
    } else {
      window.startNextPeriod();
    }
  };

  window.switchToPeriod = async function (direction) {
    try {
      const res = await fetch(`${FUNC_URL}/switchQrPeriod`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({ date: document.getElementById('session-date').value, direction })
      });
      const data = await res.json();
      if (!data.success) { alert(data.message); return; }
      currentPeriod = data.period;
      maxPeriod = data.maxPeriod || data.period;
      isFinalPeriod = !!data.isFinalPeriod;
      renderPeriodTabs();
      renderPeriodCounts();
      updateEndSessionBtn();
      drawQr(data.qrPayload);
      resubscribeCheckins();
      startRotateLoop();
    } catch (e) {
      alert('교시 이동에 실패했습니다: ' + e.message);
    }
  };

  function updateEndSessionBtn() {
    const btn = document.getElementById('btn-end-session');
    if (!btn) return;
    btn.disabled = isFinalPeriod;
    btn.textContent = isFinalPeriod ? '교육 종료됨' : '교육 종료 QR 및 서명';
  }

  window.endSession = async function () {
    if (!confirm('오늘 세션을 종료하시겠습니까? 종료 후에는 이 세션으로 더 이상 체크인할 수 없습니다.')) return;
    const btn = document.getElementById('btn-end-session');
    btn.disabled = true;
    try {
      const res = await fetch(`${FUNC_URL}/endQrSession`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({ date: document.getElementById('session-date').value })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || '종료 실패');

      clearRotateInterval();
      if (checkinsUnsub) { checkinsUnsub(); checkinsUnsub = null; }
      if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
      if (makeupRequestsUnsub) { makeupRequestsUnsub(); makeupRequestsUnsub = null; }
      currentPeriod = null;
      maxPeriod = 0;
      isFinalPeriod = false;
      finalPeriodNum = null;
      document.getElementById('qr-canvas').innerHTML = '<span class="qr-placeholder">시작 전</span>';
      document.getElementById('qr-countdown').textContent = '';
      document.getElementById('session-date').disabled = false;
      btn.style.display = 'none';
      renderPeriodTabs();
      updatePanelHeader();
      renderPeriodCounts();
    } catch (e) {
      alert('세션 종료에 실패했습니다: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  };

  async function resumeIfInProgress() {
    try {
      const sid = sessionId();
      const snap = await getDoc(doc(db, 'sessions', sid));
      if (!snap.exists()) return;
      const data = snap.data();
      if (!data.currentPeriod || data.status === 'closed') return;
      currentPeriod = data.currentPeriod;
      maxPeriod = data.maxPeriod || data.currentPeriod;
      isFinalPeriod = data.finalPeriod === data.currentPeriod;
      finalPeriodNum = data.finalPeriod != null ? data.finalPeriod : null;
      renderPeriodTabs();
      renderPeriodCounts();
      document.getElementById('session-date').disabled = true;
      document.getElementById('btn-end-session').style.display = 'inline-block';
      updateEndSessionBtn();
      const res = await fetch(`${FUNC_URL}/rotateQrToken`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({})
      });
      if (!res.ok) return;
      const rdata = await res.json();
      if (!rdata.success) return;
      drawQr(rdata.qrPayload);
      resubscribeCheckins();
      startSessionListener();
      startMakeupRequestsListener();
      startRotateLoop();
    } catch (e) {
      console.warn('이어받기 실패:', e);
    }
  }

  function startSessionListener() {
    if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
    const sid = sessionId();
    sessionUnsub = onSnapshot(doc(db, 'sessions', sid), (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      if (!data.currentPeriod) return;
      currentPeriod = data.currentPeriod;
      maxPeriod = data.maxPeriod || data.currentPeriod;
      isFinalPeriod = data.finalPeriod === data.currentPeriod;
      finalPeriodNum = data.finalPeriod != null ? data.finalPeriod : null;
      renderPeriodTabs();
      renderPeriodCounts();
      updateEndSessionBtn();
      drawQr(JSON.stringify({ a: ORG_ID, s: sid, p: data.currentPeriod, t: data.periodToken }));
    });
  }

  // ── KMA(edu.kma.org) 일정 스크래핑 — 관리자 브라우저에서 직접 ──
  // 클라우드/데이터센터 IP는 KMA가 차단해서(GCP·GitHub Actions 전부 TCP 타임아웃) Cloud
  // Functions에서는 불가능하지만, KMA가 CORS를 전면 허용(Access-Control-Allow-Origin: *,
  // 목록/상세 모두 확인)해서 브라우저 fetch로는 프록시 없이 바로 읽힌다. 파싱 로직은
  // 원래 CF에 있던 것과 동일한 마크업 구조/정규식 그대로 옮겨왔다.
  const KMA_LIST_URL = 'https://edu.kma.org/edu/schedule';
  const KMA_DETAIL_URL = 'https://edu.kma.org/edu/schedule_view';

  function stripHtmlTags(html) {
    return String(html || '')
      .replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&#47;/g, '/')
      .replace(/&amp;/g, '&')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // 목록 마크업:
  //   <p class="mb5" onclick="$.viewer(EDUIDX)">TITLE<span>평점 N</span></p>
  //   <ul class="cyberKindList">
  //     <li>...교육일자</span>DATE</li>
  //     <li>...기관명</span><span title="ORG">...</span></li>
  //     <li>...장소</span><span title="PLACE">...</span></li>
  //   </ul>
  function parseKmaListHtml(html) {
    const items = [];
    const blockRe = /<p class="mb5" onclick="\$\.viewer\((\d+)\)"[^>]*>([\s\S]*?)<\/p>\s*<ul class="cyberKindList"[^>]*>([\s\S]*?)<\/ul>/g;
    let m;
    while ((m = blockRe.exec(html))) {
      const eduidx = m[1];
      const titleBlock = m[2];
      const ulBlock = m[3];
      // 제목 블록 안 "평점 N" <span>은 떼어내고 남은 텍스트가 제목.
      const title = stripHtmlTags(titleBlock.replace(/<span[^>]*>[\s\S]*?<\/span>/g, ''));
      const dateMatch = ulBlock.match(/교육일자<\/span>\s*([\d-]+)/);
      const orgMatch = ulBlock.match(/기관명<\/span>\s*<span[^>]*title="([^"]*)"/);
      const placeMatch = ulBlock.match(/장소<\/span>\s*<span[^>]*title="([^"]*)"/);
      items.push({
        eduidx,
        title,
        date: dateMatch ? dateMatch[1].trim() : '',
        orgName: orgMatch ? orgMatch[1].trim() : '',
        place: placeMatch ? placeMatch[1].trim() : '',
      });
    }
    return items;
  }

  // 상세 마크업: <table class="scheduleList">의 <tbody> 안 <tr>마다 <td> 6개
  //   = 구분 / 월-일 / 시간 / 교육제목 / 강사 / 소속
  function parseKmaDetailHtml(html) {
    const tableMatch = html.match(/<table class="scheduleList"[\s\S]*?<tbody>([\s\S]*?)<\/tbody>\s*<\/table>/);
    if (!tableMatch) return [];
    const tbodyHtml = tableMatch[1];
    const rows = [];
    const trRe = /<tr>([\s\S]*?)<\/tr>/g;
    let trMatch;
    while ((trMatch = trRe.exec(tbodyHtml))) {
      const tdRe = /<td[^>]*>([\s\S]*?)<\/td>/g;
      const tds = [];
      let tdMatch;
      while ((tdMatch = tdRe.exec(trMatch[1]))) {
        tds.push(stripHtmlTags(tdMatch[1]));
      }
      if (tds.length >= 6) {
        rows.push({ time: tds[2], title: tds[3], instructor: tds[4], affiliation: tds[5] });
      }
    }
    return rows;
  }

  // 페이지네이션은 goPage(N) 링크로 노출된다(2개월 범위 기준 최대 23 확인).
  function parseMaxPage(html) {
    let max = 1;
    const re = /goPage\((\d+)\)/g;
    let m;
    while ((m = re.exec(html))) {
      const n = parseInt(m[1], 10);
      if (n > max) max = n;
    }
    return max;
  }

  async function fetchKmaHtml(params) {
    const res = await fetch(`${KMA_LIST_URL}?${new URLSearchParams(params).toString()}`);
    return res.text();
  }

  async function fetchKmaDetailHtml(eduidx) {
    const res = await fetch(`${KMA_DETAIL_URL}?${new URLSearchParams({ eduidx }).toString()}`);
    return res.text();
  }

  // 기관명을 문서ID로 쓰되 Firestore가 금지하는 문자만 치환(원래 CF의 sanitizeOrgId와 동일 규칙).
  function sanitizeOrgId(name) {
    let id = String(name || '').trim().replace(/\//g, '_').replace(/\s+/g, ' ');
    return id.replace(/^\.+/, '').replace(/\.+$/, '');
  }

  // 대시보드 진입 시 백그라운드로 호출(렌더를 막지 않음). 이미 오늘 문서가 있으면 그냥
  // 넘어가서, 관리자가 여러 명이어도 그날 한 번만 긁는다. force=true면 기존 문서를 무시하고
  // 다시 긁어 덮어쓴다(패널의 "새로고침" 버튼).
  async function refreshTodaySchedule(force) {
    try {
      const today = todayKST();
      const schedRef = doc(db, 'schedule', `${ORG_ID}_${today}`);
      if (!force) {
        const existing = await getDoc(schedRef);
        if (existing.exists()) return;
      }

      // 하루치라 보통 1페이지지만, goPage 링크가 더 있으면 최대 5페이지까지만 이어 긁는다.
      let items = [];
      const firstHtml = await fetchKmaHtml({ start_dt: today, end_dt: today, pageNo: 1 });
      items = items.concat(parseKmaListHtml(firstHtml));
      const maxPage = Math.min(parseMaxPage(firstHtml), 5);
      for (let p = 2; p <= maxPage; p++) {
        const html = await fetchKmaHtml({ start_dt: today, end_dt: today, pageNo: p });
        items = items.concat(parseKmaListHtml(html));
      }

      // 기관명 매칭 — 정확 일치 우선, 없으면 포함관계로 느슨하게(서버 필터는 쓰지 않는다).
      const sameDate = items.filter(i => i.date === today);
      const exact = orgName ? sameDate.filter(i => i.orgName === orgName) : [];
      const loose = exact.length ? exact : sameDate.filter(i => orgName && (i.orgName.includes(orgName) || orgName.includes(i.orgName)));
      const matched = exact.length ? exact : loose;

      const courses = [];
      for (const item of matched) {
        try {
          const detailHtml = await fetchKmaDetailHtml(item.eduidx);
          for (const row of parseKmaDetailHtml(detailHtml)) courses.push(row);
        } catch (e) {
          console.warn('상세 시간표 조회 실패(무시):', item.eduidx, e);
        }
      }

      // 매칭이 하나도 없어도 courses:[]로 저장해 "오늘은 이미 확인함"을 남긴다(매번 재조회
      // 방지). 반대로 fetch 자체가 실패해 catch로 빠지면 문서를 만들지 않아 다음에 재시도된다.
      await setDoc(schedRef, {
        orgId: ORG_ID, orgName, date: today, courses,
        updatedAt: serverTimestamp(),
      });
    } catch (e) {
      console.warn('KMA 일정 조회 실패(무시):', e);
    }
  }

  window.refreshScheduleNow = async function () {
    const btn = document.getElementById('btn-refresh-schedule');
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = '불러오는 중...';
    try {
      await refreshTodaySchedule(true);
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  };

  // 가입 화면 기관 목록 — Firestore orgs 캐시에 더해 KMA 목록(오늘~+2개월)을 브라우저에서
  // 직접 긁어 합친다. 수백 건을 orgs에 대량 저장하지는 않고(낭비), 실제 선택된 1건만
  // 가입 시 저장한다.
  let kmaOrgLoadStarted = false;

  async function loadOrgsFromKma() {
    if (kmaOrgLoadStarted) return;
    kmaOrgLoadStarted = true;
    const hintEl = document.getElementById('org-load-hint');
    if (hintEl) { hintEl.textContent = '기관 목록 불러오는 중...'; hintEl.hidden = false; }
    try {
      const today = todayKST();
      const endObj = new Date(today + 'T00:00:00+09:00');
      endObj.setMonth(endObj.getMonth() + 2);
      const endDt = endObj.toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });

      const firstHtml = await fetchKmaHtml({ start_dt: today, end_dt: endDt, pageNo: 1 });
      const collected = parseKmaListHtml(firstHtml);
      const maxPage = Math.min(parseMaxPage(firstHtml), 30);

      // 나머지 페이지는 6개씩 병렬로(실측 23페이지 약 3.5초). 개별 실패는 무시하고 진행.
      const pages = [];
      for (let p = 2; p <= maxPage; p++) pages.push(p);
      const CHUNK = 6;
      for (let i = 0; i < pages.length; i += CHUNK) {
        const htmls = await Promise.all(pages.slice(i, i + CHUNK).map(p =>
          fetchKmaHtml({ start_dt: today, end_dt: endDt, pageNo: p }).catch(() => '')
        ));
        htmls.forEach(h => { if (h) collected.push(...parseKmaListHtml(h)); });
      }

      // Firestore 캐시와 합쳐 기관명 기준 중복 제거.
      const byName = new Map();
      allOrgs.forEach(o => byName.set(o.name, o));
      collected.forEach(i => {
        if (i.orgName && !byName.has(i.orgName)) byName.set(i.orgName, { id: sanitizeOrgId(i.orgName), name: i.orgName });
      });
      allOrgs = [...byName.values()];
    } catch (e) {
      console.warn('KMA 기관 목록 조회 실패(무시):', e);
    } finally {
      if (hintEl) hintEl.hidden = true;
    }
  }

  // ── 출석 서명요청 ──
  let makeupAllStudents = [];

  const MAKEUP_STATUS_LABEL = { pending: '대기중(미제출)', submitted: '제출됨 — 검토 필요', approved: '승인됨', rejected: '거부됨' };

  function renderMakeupRequestsList(list) {

  function startRotateLoop() {
    clearRotateInterval();
    countdownSec = 5;
    updateCountdownLabel();
    countdownInterval = setInterval(() => {
      countdownSec--;
      if (countdownSec <= 0) countdownSec = 5;
      updateCountdownLabel();
    }, 1000);
    rotateInterval = setInterval(rotateQr, 5000);
  }

  function updateCountdownLabel() {
    document.getElementById('qr-countdown').textContent = `${countdownSec}초 후 갱신`;
  }

  async function rotateQr() {
    try {
      const res = await fetch(`${FUNC_URL}/rotateQrToken`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({})
      });
      if (!res.ok) throw new Error('갱신 실패');
      const data = await res.json();
      if (currentPeriod == null) return;
      drawQr(data.qrPayload);
      countdownSec = 5;
      updateCountdownLabel();
    } catch (e) {
      console.warn('QR 갱신 실패:', e);
    }
  }

  // 학생 웹 주소 — QR을 이 링크로 감싸서, 가입 전인 학생이 일반 카메라 앱으로 찍어도
  // 학생 웹으로 넘어가 로그인/가입까지 이어서 하고, 끝나자마자 자동으로 이 QR로 출석
  // 처리되도록 한다(학생 웹 index.html의 consumePendingScanIfAny 참고).
  const STUDENT_WEB_URL = 'https://knadlg1.github.io/ce/';

  function drawQr(payload) {
    const container = document.getElementById('qr-canvas');
    container.innerHTML = '';
    const url = STUDENT_WEB_URL + '?scan=' + encodeURIComponent(payload);
    new QRCode(container, { text: url, width: 660, height: 660, correctLevel: QRCode.CorrectLevel.M });
  }

  // 교시 타임라인 — QR은 "교시 중"이 아니라 "교시와 교시 사이"에 찍는 것이라,
  // 📷 스캔 지점과 교시 박스를 번갈아 세로로 그려서 그 의미를 시각화한다.
  //   ( 📷 ) period 1  = 교육시작 전
  //   [1교시]
  //   ( 📷 ) period 2  = 1교시 종료 / 2교시 시작
  //   [2교시] ...
  // 현재 스캔 지점은 진하게+펄스, 지나간 지점은 흐리게, 각 지점에는 그 교시에
  // 몇 명이 찍었는지 숫자 배지를 단다(기존 periodCounts 재사용).
  // 타임라인에 그릴 스캔 지점 목록 — [{p, isFinalPoint, cls, icon, count}]
  // QR 위(큰 버전)와 오른쪽 패널(compact 2개), '총 인원 수' 행이 모두 이 배열을 써서
  // 같은 순서/같은 열로 그려지므로 서로 정확히 정렬된다.
  function timelinePoints() {
    if (!currentPeriod) return [{ p: 1, isFinalPoint: false, cls: '', icon: '📷', count: 0 }];
    const lastPoint = Math.max(maxPeriod || 0, currentPeriod);
    const points = [];
    for (let p = 1; p <= lastPoint; p++) {
      const isFinalPoint = (finalPeriodNum != null && p === finalPeriodNum);
      points.push({
        p,
        isFinalPoint,
        cls: p === currentPeriod ? 'active' : (p < currentPeriod ? 'done' : ''),
        icon: isFinalPoint ? '🏁' : '📷',
        count: periodCounts[p] || 0,
      });
    }
    return points;
  }

  function timelineHtml() {
    let html = '';
    timelinePoints().forEach((pt, i) => {
      if (i > 0) html += '<div class="tl-line"></div>';
      const badge = pt.count > 0 ? `<div class="tl-dot-badge">${pt.count}</div>` : '';
      html += `<div class="tl-dot ${pt.cls}">${pt.icon}${badge}</div>`;
      // 마지막(종료) 지점 뒤에는 수업이 없으므로 교시 박스를 그리지 않는다.
      if (!pt.isFinalPoint) {
        html += '<div class="tl-line"></div>';
        html += `<div class="tl-class">${pt.p}교시</div>`;
      }
    });
    return html;
  }

  function renderPeriodTabs() {
    document.getElementById('btn-start-period').textContent = currentPeriod ? '다음 교시 ▶' : '교육시작';
    updatePrevNextButtons();
    const html = timelineHtml();
    document.getElementById('period-tabs').innerHTML = html;
    const p1 = document.getElementById('panel-timeline-1');
    const p2 = document.getElementById('panel-timeline-2');
    if (p1) p1.innerHTML = html;
    if (p2) p2.innerHTML = html;
    renderTotalsRow();
  }

  // '총 인원 수' — 위 compact 타임라인과 같은 순서/폭으로 그려 열을 맞춘다.
  function renderTotalsRow() {
    const el = document.getElementById('panel-total-row');
    if (!el) return;
    const points = timelinePoints();
    const max = Math.max(1, ...points.map(pt => pt.count));
    let html = '';
    points.forEach((pt, i) => {
      if (i > 0) html += '<div class="tot-line"></div>';
      const h = Math.round((pt.count / max) * 34);
      html += `<div class="tot-cell"><div class="tot-bar" style="height:${h}px"></div><div class="tot-num">${pt.count}</div></div>`;
      if (!pt.isFinalPoint) html += '<div class="tot-line"></div><div class="tot-gap"></div>';
    });
    el.innerHTML = html;
  }

  function updatePrevNextButtons() {
    const prevBtn = document.getElementById('btn-prev-period');
    if (!prevBtn) return;
    prevBtn.disabled = !currentPeriod || currentPeriod <= 1;
  }

  function startRosterListener() {

      // 아니라 문서 전체(kakaoId/name/phone)를 들고 있는다.
      rosterAll = snap.docs.map(d => ({ kakaoId: d.id, ...d.data() }));

  let rosterPollInterval = null;

  function startRosterPoll() {
    if (rosterPollInterval) clearInterval(rosterPollInterval);
    rosterPollInterval = setInterval(async () => {
      try {
        const sid = sessionId();
        const snap = await getDocs(collection(db, 'sessions', sid, 'roster'));
        rosterAll = snap.docs.map(d => ({ kakaoId: d.id, ...d.data() }));

  function stopRosterPoll() {
    if (rosterPollInterval) { clearInterval(rosterPollInterval); rosterPollInterval = null; }
  }

  let lastRosterSize = 0;
  let lastCheckinSize = 0;
  let rosterAll = [];              // 오늘 한 번이라도 찍은 전체 명단
  let checkedIdsThisPeriod = new Set(); // 이번 스캔 지점에서 찍은 kakaoId

  // 기존 호출부 호환용 래퍼 — 실제 렌더는 renderAttendancePanel이 전담한다.
  function updatePanelHeader() { renderAttendancePanel(); }

  function rosterItemHtml(p) {
    return `<div class="roster-item"><span>${escapeHtml(maskName(p.name))}</span><span class="roster-phone">${escapeHtml(last4Phone(p.phone))}</span></div>`;
  }

  // 게이지 + "아직 안 찍은 분"(위 70%) + "체크 완료"(아래 30%).
  // 안 찍은 사람 = 오늘 명단(roster) − 이번 교시 체크인. 첫 스캔 지점에서는 아직 아무도
  // 명단에 없어서 비어 보이는 게 정상이고, 2교시부터 "나만 아직 안 찍었네"가 드러난다.
  function renderAttendancePanel() {
    const fillAbsent = document.getElementById('att-fill-absent');
    const fillDone = document.getElementById('att-fill-done');
    const legendAbsent = document.getElementById('att-legend-absent');
    const legendDone = document.getElementById('att-legend-done');
    const absentList = document.getElementById('att-absent-list');
    const doneList = document.getElementById('att-done-list');
    if (!fillAbsent || !absentList) return;

    if (currentPeriod == null) {
      fillAbsent.style.width = '0%';
      fillDone.style.width = '0%';
      legendAbsent.textContent = '미체크 -';
      legendDone.textContent = '체크 -';
      absentList.innerHTML = '<div class="roster-empty">교시를 시작하면 표시됩니다.</div>';
      doneList.innerHTML = '<div class="roster-empty">-</div>';
      return;
    }

    const done = rosterAll.filter(p => checkedIdsThisPeriod.has(String(p.kakaoId)));
    const absent = rosterAll.filter(p => !checkedIdsThisPeriod.has(String(p.kakaoId)));
    const total = rosterAll.length;

    // 붉은색(미체크) + 파란색(체크)을 한 줄에 쌓아 비율로 보여준다.
    fillAbsent.style.width = total ? (absent.length / total) * 100 + '%' : '0%';
    fillDone.style.width = total ? (done.length / total) * 100 + '%' : '0%';
    legendAbsent.textContent = `미체크 ${absent.length}명`;
    legendDone.textContent = `체크 ${done.length}명`;

    absentList.innerHTML = absent.length
      ? absent.map(rosterItemHtml).join('')
      : (total ? '<div class="roster-empty">전원 체크 완료 🎉</div>' : '<div class="roster-empty">아직 찍은 분이 없습니다.</div>');
    doneList.innerHTML = done.length
      ? done.map(rosterItemHtml).join('')
      : '<div class="roster-empty">-</div>';
  }

  // ── 교육종료 확인창 ──
  window.confirmEndSession = function () {
    document.getElementById('end-confirm-backdrop').style.display = 'flex';
  };
  window.closeEndConfirm = function () {
    document.getElementById('end-confirm-backdrop').style.display = 'none';
  };
  window.doEndSessionConfirmed = function () {
    closeEndConfirm();
    startNextPeriod(true);
  };

  function maskName(name) {
    const s = String(name || '').trim();
    if (s.length <= 1) return s;
    return s.slice(0, -1) + '*';
  }
  function last4Phone(phone) {
    const digits = String(phone || '').replace(/\D/g, '');
    return digits.length >= 4 ? digits.slice(-4) : digits;
  }
  function resubscribeCheckins() {
    if (checkinsUnsub) { checkinsUnsub(); checkinsUnsub = null; }
    if (currentPeriod == null) { checkedIdsThisPeriod = new Set(); renderAttendancePanel(); return; }
    const sid = sessionId();
    const q = query(collection(db, 'sessions', sid, 'checkins'), where('period', '==', currentPeriod));
    checkinsUnsub = onSnapshot(q, (snap) => {
      lastCheckinSize = snap.size;
      checkedIdsThisPeriod = new Set(snap.docs.map(d => String(d.data().kakaoId)));
      renderPeriodCounts();
      renderAttendancePanel();
    });
  }

  let periodCounts = {};

  function startPeriodCountsListener() {
    const sid = sessionId();
    if (periodCountsUnsub) periodCountsUnsub();
    periodCountsUnsub = onSnapshot(collection(db, 'sessions', sid, 'checkins'), (snap) => {
      const counts = {};
      snap.forEach(d => {
        const p = d.data().period;
        if (p != null) counts[p] = (counts[p] || 0) + 1;
      });
      periodCounts = counts;
      renderPeriodCounts();
    });
  }

  // 교시별 인원수는 이제 타임라인 📷 동그라미의 숫자 배지로 보여주므로, 별도 목록 줄
  // (#period-counts)은 없앴다. 호출부가 여러 곳이라 함수는 남겨두고 타임라인을 다시 그린다.
  function renderPeriodCounts() {
    renderPeriodTabs();
  }

  // ── 로그인 상태 진입점 ──
  onAuthStateChanged(auth, async (user) => {
    // 가입 처리 중이면 doSignup이 admins 문서 저장까지 마치고 직접 대시보드로 진입시킨다
    // — 여기서 먼저 끼어들면 아직 없는 admins 문서를 보고 방금 만든 계정을 로그아웃시킨다.
    if (signingUp) return;
    if (!user || user.isAnonymous) {
      // 익명 세션(가입화면 기관검색용)이거나 로그아웃 상태 — 실제 관리자 로그인 아님.
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('auth-wrap').style.display = 'flex';
      return;
    }
    try {
      const adminSnap = await getDoc(doc(db, 'admins', user.uid));
      if (!adminSnap.exists() || !adminSnap.data().orgId) {
        await auth.signOut();
        const errEl = document.getElementById('login-error');
        if (errEl) {
          errEl.textContent = '이 계정에 연결된 기관 정보를 찾을 수 없습니다.';
          errEl.style.display = 'block';
        }
        return;
      }
      ORG_ID = adminSnap.data().orgId;
      orgName = adminSnap.data().orgName || '';
      await enterDashboard();
    } catch (e) {
      console.warn('로그인 상태 확인 실패:', e);
    }
  });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

:root {
  --brand: #6c63ff;
  --brand-dark: #5651d5;
  --brand-xlight: #ede9fe;
  --canvas: #f4f5f7;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --text: #111827;
  --muted: #6B7280;
  --radius: 10px;
  --pill: 50px;
  --shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--canvas);color:var(--text);letter-spacing:-0.01em;min-height:100vh;}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--surface);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.3);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo-mark{width:64px;height:64px;background:var(--brand);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;margin:0 auto 14px;}
.auth-logo-title{font-size:22px;font-weight:800;color:var(--text);margin-top:8px;letter-spacing:-0.02em;}
.auth-logo-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.auth-form-label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase;}
.auth-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);outline:none;margin-bottom:14px;background:#fff;transition:border-color .15s;}
.auth-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(108,99,255,.12);}
.auth-btn{width:100%;padding:15px;border-radius:var(--pill);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:-0.01em;}
.auth-btn:active{transform:scale(0.97);}
.auth-btn-primary{background:var(--brand);color:#fff;margin-bottom:10px;}
.auth-btn-primary:hover{background:var(--brand-dark);}
.auth-error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}

/* 기관 검색 자동완성 */
.org-search-wrap{position:relative;}
.org-dropdown{display:none;position:absolute;top:calc(100% - 8px);left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:10px;max-height:200px;overflow-y:auto;z-index:20;box-shadow:var(--shadow);}
.org-option{padding:10px 14px;font-size:14px;cursor:pointer;}
.org-option:hover{background:var(--brand-xlight);color:var(--brand);}
.org-option-empty{padding:10px 14px;font-size:13px;color:var(--muted);}
.org-load-hint{font-size:12px;color:var(--muted);margin:-8px 0 12px 2px;}

/* ── TOP BAR ── */
.topbar{position:relative;display:flex;align-items:center;justify-content:flex-end;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
/* 탭은 로그아웃 버튼 유무와 상관없이 화면 정중앙에 오도록 절대배치한다. */
.topbar-tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:8px;}
.topbar-tab{background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:9px 26px;border-radius:var(--pill);cursor:pointer;font-size:14px;font-weight:700;transition:.15s;}
.topbar-tab:hover{border-color:var(--brand);color:var(--brand);}
.topbar-tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn-logout{background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:var(--pill);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;}
.btn-logout:hover{border-color:var(--brand);color:var(--brand);}

#dashboard{display:none;flex-direction:column;min-height:100vh;}
.page{padding:32px;}

/* ── QR PAGE ── */
.qr-wrap{display:flex;gap:24px;align-items:stretch;justify-content:center;}
.qr-side-left{display:flex;flex-direction:column;gap:32px;width:240px;flex-shrink:0;}
.qr-org-date{display:flex;flex-direction:column;gap:10px;}
.org-name-big{font-size:28px;font-weight:800;color:var(--text);line-height:1.3;word-break:keep-all;}
.qr-side-actions{display:flex;flex-direction:column;gap:14px;}
.qr-side-actions .btn-primary{margin:0;padding:20px;font-size:17px;}
.qr-card{background:var(--surface);border-radius:20px;padding:40px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:22px;}
#qr-canvas{border-radius:12px;min-width:520px;min-height:520px;display:flex;align-items:center;justify-content:center;}
.qr-placeholder{font-size:20px;font-weight:700;color:var(--muted);}
.qr-countdown{font-size:15px;font-weight:700;color:var(--brand);}
.current-period{font-size:20px;font-weight:800;color:var(--text);white-space:pre-line;}
.btn-primary{background:var(--brand);color:#fff;border:none;padding:14px 32px;border-radius:var(--pill);font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.qr-body{display:flex;flex-direction:column;align-items:center;gap:14px;}

/* ── 교시 타임라인 (가로) ───────────────────────────────────────
   QR은 "교시 중"이 아니라 "교시와 교시 사이"에 찍는 것이라, 📷 스캔 지점과
   교시 박스를 번갈아 가로로 배치해 그 의미가 한눈에 보이게 한다.
   period N = (N-1)교시와 N교시 사이의 스캔 지점(period 1 = 교육시작 전).
   같은 마크업을 오른쪽 패널에서도 compact 크기로 재사용한다. */
.tl-row{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:0;overflow-x:auto;padding:4px 2px;max-width:100%;}
.tl-dot{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px dashed var(--border);background:#fff;color:var(--muted);flex-shrink:0;}
.tl-dot.done{border-style:solid;border-color:#c7d2fe;background:#eef2ff;color:#6366f1;}
.tl-dot.active{border-style:solid;border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(108,99,255,0.18);animation:tlPulse 1.8s ease-in-out infinite;}
@keyframes tlPulse{0%,100%{box-shadow:0 0 0 5px rgba(108,99,255,0.18);}50%{box-shadow:0 0 0 11px rgba(108,99,255,0.08);}}
.tl-dot-badge{position:absolute;right:-5px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--text);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.tl-line{height:2px;width:12px;background:var(--border);flex-shrink:0;}
.tl-class{width:56px;padding:8px 0;border-radius:10px;font-size:13px;font-weight:800;text-align:center;background:var(--canvas);color:var(--muted);border:1.5px solid var(--border);white-space:nowrap;flex-shrink:0;}

/* 오른쪽 패널용 축소 버전 — 같은 구조라 아래 '총 인원 수' 행과 열이 정확히 맞는다. */
.tl-row.compact .tl-dot{width:34px;height:34px;font-size:15px;border-width:1.5px;}
.tl-row.compact .tl-dot.active{box-shadow:0 0 0 3px rgba(108,99,255,0.18);animation:none;}
.tl-row.compact .tl-dot-badge{display:none;}
.tl-row.compact .tl-class{width:40px;padding:5px 0;font-size:10px;border-radius:7px;}
.tl-row.compact .tl-line{width:6px;}

/* ── ROSTER PANEL ── */
.roster-panel{background:var(--surface);border-radius:20px;padding:24px;box-shadow:var(--shadow);width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}

/* ── 출석 현황 패널 ───────────────────────────────────────────
   주인공은 "아직 안 찍은 사람" — 학생이 이 화면을 보고 본인이 아직
   안 찍었다는 걸 스스로 알아채게 하는 게 목적이라 위쪽 70%를 준다.
   두 목록 모두 각자 고정 높이 안에서만 스크롤되게 해서, 인원이 많아져도
   패널이 세로로 늘어나지 않게 한다. */
.panel-label{font-size:14px;font-weight:800;color:var(--text);flex-shrink:0;}

/* 미체크(붉은색) + 체크(파란색)를 한 줄에 쌓아 이번 지점의 진행도를 한눈에 보여준다. */
.att-gauge{flex-shrink:0;}
.att-gauge-bar{display:flex;height:16px;border-radius:8px;background:var(--canvas);border:1px solid var(--border);overflow:hidden;margin-top:8px;}
.att-fill-absent{height:100%;background:#f87171;transition:width .35s ease;}
.att-fill-done{height:100%;background:var(--brand);transition:width .35s ease;}
.att-legend{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-top:6px;}
.att-legend-absent{color:#dc2626;}
.att-legend-done{color:var(--brand);}

/* 명단 두 개를 좌(미체크)/우(체크)로 나란히 — 각자 박스 안에서만 스크롤된다. */
.att-lists{display:flex;gap:10px;flex:1;min-height:0;}
.att-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.att-list{overflow-y:auto;display:flex;flex-direction:column;gap:5px;flex:1;min-height:70px;padding:6px;border-radius:10px;background:var(--canvas);border:1px solid var(--border);}
.att-col-absent .att-list{background:#fef2f2;border-color:#fecaca;}
.att-col-absent .roster-item{background:#fff;border:1px solid #fecaca;}
.att-col-done .roster-item{background:#fff;border:1px solid #ddd9ff;}

/* '총 인원 수' — 위 compact 타임라인과 같은 폭/순서로 그려 열이 정확히 맞는다. */
.tot-row{display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:0;overflow-x:auto;padding:2px;}
.tot-cell{width:34px;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;}
.tot-bar{width:16px;background:var(--brand);border-radius:3px 3px 0 0;min-height:3px;}
.tot-num{font-size:11px;font-weight:800;color:var(--text);}
.tot-gap{width:40px;flex-shrink:0;}
.tot-line{width:6px;flex-shrink:0;}

/* 교육종료 확인창 */
.confirm-backdrop{position:fixed;inset:0;background:rgba(17,24,39,0.5);display:flex;align-items:center;justify-content:center;z-index:200;}
.confirm-card{background:var(--surface);border-radius:18px;padding:28px 30px;box-shadow:var(--shadow);max-width:400px;text-align:center;}
.confirm-text{font-size:17px;font-weight:800;color:var(--text);line-height:1.5;margin-bottom:22px;}
.confirm-actions{display:flex;gap:10px;justify-content:center;}
.confirm-actions .btn-primary{margin:0;}
.confirm-cancel{background:var(--canvas)!important;color:var(--muted)!important;border:1.5px solid var(--border)!important;}
.roster-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--canvas);border-radius:8px;font-size:14px;font-weight:600;}
.roster-phone{color:var(--muted);font-weight:700;font-size:13px;}
.roster-empty{font-size:13px;color:var(--muted);text-align:center;padding:20px;}

/* ── 출석 서명요청 / 오늘의 시간표 (공용 카드) ── */
.hist-detail-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;overflow-x:auto;}
.hist-empty{font-size:13px;color:var(--muted);padding:8px;}
.hist-table{border-collapse:collapse;width:100%;font-size:13px;}
.hist-table th,.hist-table td{border:1px solid var(--border);padding:8px 12px;text-align:center;white-space:nowrap;}
.hist-table th{background:var(--brand-xlight);color:var(--brand);font-weight:800;}
</style>
</head>
<body>

<!-- ── AUTH ── -->
<div id="auth-wrap" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">연</div>
      <div class="auth-logo-title">연수교육 QR 인증</div>
      <div class="auth-logo-sub">관리자 로그인</div>
    </div>
    <div class="auth-error" id="login-error"></div>
    <label class="auth-form-label">이메일</label>
    <input class="auth-input" id="login-email" type="email" placeholder="admin@example.com">
    <label class="auth-form-label">비밀번호</label>
    <input class="auth-input" id="login-pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="auth-btn auth-btn-primary" onclick="doLogin()">로그인</button>
    <div style="text-align:center;margin-top:6px;">
      <a href="javascript:void(0)" onclick="showSignup()" style="color:var(--brand);font-size:13px;text-decoration:none;font-weight:600;">계정이 없으신가요? 회원가입</a>
    </div>
  </div>
  <div class="auth-card" id="signup-card" style="display:none;">
    <div class="auth-logo">
      <div class="auth-logo-mark">연</div>
      <div class="auth-logo-title">회원가입</div>
      <div class="auth-logo-sub">기관을 검색해서 선택해주세요</div>
    </div>
    <div class="auth-error" id="signup-error"></div>

    <label class="auth-form-label">기관 검색</label>
    <div class="org-search-wrap">
      <input class="auth-input" id="signup-org-search" type="text" placeholder="기관명 입력" autocomplete="off" oninput="onOrgSearchInput()">
      <div class="org-dropdown" id="signup-org-dropdown"></div>
    </div>
    <div class="org-load-hint" id="org-load-hint" hidden></div>
    <label class="auth-form-label">이메일</label>
    <input class="auth-input" id="signup-email" type="email" placeholder="admin@example.com">
    <label class="auth-form-label">비밀번호 (최소 6자)</label>
    <input class="auth-input" id="signup-pw" type="password" placeholder="비밀번호 입력">
    <button class="auth-btn auth-btn-primary" id="btn-submit-signup" onclick="doSignup()">가입하기</button>

    <div style="text-align:center;margin-top:6px;">
      <a href="javascript:void(0)" onclick="showLoginFromSignup()" style="color:var(--muted);font-size:13px;text-decoration:none;">로그인으로 돌아가기</a>
    </div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-tabs">
      <button class="topbar-tab active" id="tab-btn-qr" onclick="switchTab('qr')">QR</button>
      <button class="topbar-tab" id="tab-btn-admin" onclick="switchTab('admin')">관리자</button>
    </div>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <div class="page" id="page-qr">
    <div class="qr-wrap">
      <div class="qr-side-left">
        <div class="qr-org-date">
          <div class="org-name-big" id="org-name-label">연수교육 QR 인증</div>
          <input type="date" id="session-date" class="auth-input" style="width:100%;margin:0;font-size:22px;font-weight:800;padding:14px 18px;">
        </div>
        <div class="qr-side-actions">
          <button class="btn-primary" id="btn-prev-period" onclick="switchToPeriod('prev')" disabled>◀ 이전 교시</button>
          <button class="btn-primary" id="btn-start-period" onclick="handleNextPeriodClick()">교육시작</button>
          <button class="btn-primary" id="btn-end-session" onclick="confirmEndSession()" style="display:none;">교육종료 + 서명</button>
        </div>
      </div>
      <div class="qr-card">
        <!-- 타임라인이 QR 위에 가로로 — 어디를 찍는 시점인지 그림만으로 전달되므로
             별도 설명 문구(구 current-period-label)는 두지 않는다. -->
        <div class="qr-body">
          <div class="tl-row" id="period-tabs"></div>
          <div id="qr-canvas"><span class="qr-placeholder">시작 전</span></div>
        </div>
        <div class="qr-countdown" id="qr-countdown"></div>
      </div>
      <div class="roster-panel">
        <!-- ① QR 체크: 타임라인 + (미체크 붉은색 / 체크 파란색) 게이지 + 명단 -->
        <div class="panel-label">QR 체크</div>
        <div class="tl-row compact" id="panel-timeline-1"></div>
        <div class="att-gauge">
          <div class="att-gauge-bar">
            <div class="att-fill-absent" id="att-fill-absent" style="width:0%"></div>
            <div class="att-fill-done" id="att-fill-done" style="width:0%"></div>
          </div>
          <div class="att-legend">
            <span class="att-legend-absent" id="att-legend-absent">미체크 -</span>
            <span class="att-legend-done" id="att-legend-done">체크 -</span>
          </div>
        </div>
        <div class="att-lists">
          <div class="att-col att-col-absent">
            <div class="att-list" id="att-absent-list">
              <div class="roster-empty">교시를 시작하면 표시됩니다.</div>
            </div>
          </div>
          <div class="att-col att-col-done">
            <div class="att-list" id="att-done-list">
              <div class="roster-empty">-</div>
            </div>
          </div>
        </div>
        <!-- ② 총 인원 수: 같은 타임라인 + 스캔 지점별 체크 인원 -->
        <div class="panel-label" style="margin-top:4px;">총 인원 수</div>
        <div class="tl-row compact" id="panel-timeline-2"></div>
        <div class="tot-row" id="panel-total-row"></div>
      </div>
    </div>
  </div>

  <div class="page" id="page-admin" style="display:none;">
    <!-- 오늘 일정 다시 불러오기 — KMA는 클라우드 서버 IP를 차단해서 관리자 브라우저에서만
         재수집이 가능하다(refreshTodaySchedule은 항상 백그라운드로 유지, 이 버튼은 수동 재시도용). -->
    <div class="hist-detail-card" style="max-width:900px;margin:24px auto 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:18px;font-weight:800;color:var(--brand);">일정 관리</div>
        <button class="btn-primary" id="btn-refresh-schedule" style="padding:8px 18px;font-size:13px;" onclick="refreshScheduleNow()">오늘 일정 다시 불러오기</button>
      </div>
    </div>

    <div class="hist-detail-card" style="max-width:900px;margin:24px auto 0;">
      <div style="font-size:18px;font-weight:800;color:var(--brand);margin-bottom:14px;">출석 서명요청</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <select class="auth-input" id="makeup-student-select" style="margin:0;width:auto;flex:1;min-width:200px;">
          <option value="">학생 선택</option>
        </select>
        <input type="number" min="1" id="makeup-period-input" class="auth-input" placeholder="교시" style="margin:0;width:90px;">
        <button class="btn-primary" onclick="sendMakeupRequest()">요청 보내기</button>
      </div>
      <div id="makeup-requests-list">
        <div class="hist-empty">요청 내역이 없습니다.</div>
      </div>
    </div>

    <div class="hist-detail-card" style="max-width:900px;margin:24px auto 0;">
      <div style="font-size:18px;font-weight:800;color:var(--brand);margin-bottom:8px;">문서 자동생성</div>
      <div class="hist-empty">준비중입니다.</div>
    </div>

    <div class="hist-detail-card" style="max-width:900px;margin:24px auto 0;">
      <div style="font-size:18px;font-weight:800;color:var(--brand);margin-bottom:8px;">수업 기록 관리</div>
      <div class="hist-empty">준비중입니다.</div>
    </div>
  </div>
</div>

<!-- 교육종료는 되돌리기 번거로운 동작이라(마지막 QR 발급 + 종료 서명 강제) 실수로
     눌리지 않게 한 번 더 확인받는다. -->
<div id="end-confirm-backdrop" class="confirm-backdrop" style="display:none;">
  <div class="confirm-card">
    <div class="confirm-text">오늘 교육을 종료하고<br>마지막 서명받기용 QR 표시</div>
    <div class="confirm-actions">
      <button class="btn-primary confirm-cancel" onclick="closeEndConfirm()">취소</button>
      <button class="btn-primary" onclick="doEndSessionConfirmed()">종료 및 서명</button>
    </div>
  </div>
</div>

</body>
</html>
