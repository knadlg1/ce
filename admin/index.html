<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연수교육 QR 인증 — 관리자</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, query, where, getDocs, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  // 로그인한 계정(uid)의 admins 문서에서 orgId를 조회해 채운다(onAuthStateChanged 참고).
  // qr-admin의 ACADEMY_ID/academyName과 동일한 역할, 이름만 치환(academyId→orgId).
  let ORG_ID = null;
  let orgName = '';

  const FUNC_URL = 'https://us-central1-yeonsu-qr-auth.cloudfunctions.net';

  const app = initializeApp({
    projectId: "yeonsu-qr-auth",
    appId: "1:1001009945495:web:9f99c789e6d13404a442d2",
    storageBucket: "yeonsu-qr-auth.firebasestorage.app",
    apiKey: "AIzaSyA68rFB5yLol3v9acbwRIFPtDdX2hf2FQw",
    authDomain: "yeonsu-qr-auth.firebaseapp.com",
    messagingSenderId: "1001009945495",
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  // 로그인 전(가입 화면의 기관 검색)에도 Firestore를 읽어야 해서 익명으로 먼저 로그인해둔다
  // (보안규칙이 request.auth != null 공통 패턴 — mobile-app/qr-admin과 동일). 실제 관리자가
  // 이메일/비밀번호로 로그인·가입하면 이 익명 세션은 그 계정으로 자연스럽게 교체된다.
  signInAnonymously(auth).catch(e => console.warn('익명 로그인 실패:', e));

  // ── 상태 ──
  let currentPeriod = null;
  let maxPeriod = 0;
  let isFinalPeriod = false;
  let rotateInterval = null;
  let countdownInterval = null;
  let countdownSec = 5;
  let rosterUnsub = null;
  let checkinsUnsub = null;
  let sessionUnsub = null;
  let makeupRequestsUnsub = null;
  let periodCountsUnsub = null;
  let scheduleUnsub = null; // 오늘의 시간표(schedule/{orgId}_{date}) 구독

  function todayKST() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  }

  function sessionId() {
    return `${ORG_ID}_${todayKST()}`;
  }

  function clearRotateInterval() {
    if (rotateInterval) { clearInterval(rotateInterval); rotateInterval = null; }
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  }

  window.addEventListener('beforeunload', clearRotateInterval);

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── 로그인 ──
  window.doLogin = async function () {
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-pw').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      // 이후 처리는 onAuthStateChanged 리스너가 전담한다.
    } catch (e) {
      errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
      errEl.style.display = 'block';
    }
  };

  window.doLogout = async function () {
    clearRotateInterval();
    if (rosterUnsub) rosterUnsub();
    if (checkinsUnsub) checkinsUnsub();
    if (periodCountsUnsub) { periodCountsUnsub(); periodCountsUnsub = null; }
    if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
    if (makeupRequestsUnsub) { makeupRequestsUnsub(); makeupRequestsUnsub = null; }
    if (scheduleUnsub) { scheduleUnsub(); scheduleUnsub = null; }
    stopRosterPoll();
    await auth.signOut();
    ORG_ID = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('auth-wrap').style.display = 'flex';
    // 로그아웃 후에도 가입 화면의 기관 검색이 계속 동작하도록 익명 세션을 다시 세워둔다.
    signInAnonymously(auth).catch(e => console.warn('익명 로그인 실패:', e));
  };

  async function enterDashboard() {
    document.getElementById('auth-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    document.getElementById('topbar-title').textContent = orgName || '연수교육 QR 인증';
    document.getElementById('session-date').value = todayKST();
    startRosterListener();
    startPeriodCountsListener();
    startRosterPoll();
    loadAllOrgStudents(); // 출석 서명요청용 학생 선택 목록 — 로그인당 1회면 충분
    await resumeIfInProgress();
  }

  // ── 회원가입 — 이메일/비밀번호 + 기관 검색·선택(자기가입, qr-admin의 OTP+CF 가입과 다름) ──
  let allOrgs = [];
  let selectedOrg = null; // { id, name }

  window.showSignup = function () {
    document.getElementById('auth-wrap').querySelector('.auth-card').style.display = 'none';
    document.getElementById('signup-card').style.display = 'block';
    if (!allOrgs.length) loadAllOrgs();
  };

  window.showLoginFromSignup = function () {
    document.getElementById('signup-card').style.display = 'none';
    document.getElementById('auth-wrap').querySelector('.auth-card').style.display = 'block';
  };

  // orgs 컬렉션({name, updatedAt} 문서들) 전체를 페이지 로드 시 한 번 받아 배열로 들고
  // 있다가, 검색창 입력마다 이름 부분일치로 클라이언트에서 필터링한다(외부 라이브러리 없이
  // 순수 JS 자동완성).
  async function loadAllOrgs() {
    try {
      const snap = await getDocs(collection(db, 'orgs'));
      allOrgs = snap.docs.map(d => ({ id: d.id, name: d.data().name || d.id }));
    } catch (e) {
      console.warn('기관 목록 조회 실패:', e);
    }
  }
  loadAllOrgs();

  window.onOrgSearchInput = function () {
    const q = document.getElementById('signup-org-search').value.trim();
    selectedOrg = null;
    const dd = document.getElementById('signup-org-dropdown');
    if (!q) { dd.style.display = 'none'; dd.innerHTML = ''; return; }
    const matches = allOrgs.filter(o => o.name.includes(q)).slice(0, 30);
    if (!matches.length) {
      dd.innerHTML = '<div class="org-option-empty">검색 결과가 없습니다.</div>';
    } else {
      dd.innerHTML = matches.map(o =>
        `<div class="org-option" data-id="${escapeHtml(o.id)}" data-name="${escapeHtml(o.name)}">${escapeHtml(o.name)}</div>`
      ).join('');
    }
    dd.style.display = 'block';
  };

  document.addEventListener('click', (e) => {
    const opt = e.target.closest('.org-option');
    if (opt) {
      selectedOrg = { id: opt.dataset.id, name: opt.dataset.name };
      document.getElementById('signup-org-search').value = opt.dataset.name;
      document.getElementById('signup-org-dropdown').style.display = 'none';
      return;
    }
    if (!e.target.closest('#signup-org-search') && !e.target.closest('#signup-org-dropdown')) {
      const dd = document.getElementById('signup-org-dropdown');
      if (dd) dd.style.display = 'none';
    }
  });

  window.doSignup = async function () {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-pw').value;
    const errEl = document.getElementById('signup-error');
    errEl.style.display = 'none';
    if (!email || !password) {
      errEl.textContent = '이메일과 비밀번호를 입력해주세요.';
      errEl.style.display = 'block';
      return;
    }
    if (!selectedOrg) {
      errEl.textContent = '기관을 검색해서 선택해주세요.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('btn-submit-signup');
    btn.disabled = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'admins', cred.user.uid), {
        orgId: selectedOrg.id,
        orgName: selectedOrg.name,
        email,
        createdAt: serverTimestamp(),
      });
      // onAuthStateChanged도 뒤이어 실행되지만(같은 admins 문서를 다시 읽어 동일하게
      // enterDashboard를 부름 — 멱등이라 무해), 방금 setDoc한 값을 직접 써서 여기서도
      // 바로 진입시켜 그 사이의 레이스(문서가 아직 안 읽힐 시점)를 피한다.
      ORG_ID = selectedOrg.id;
      orgName = selectedOrg.name;
      await enterDashboard();
    } catch (e) {
      errEl.textContent = '가입 실패: ' + e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  };

  // ── 실시간 QR ──
  async function authHeader() {
    const token = await auth.currentUser.getIdToken();
    return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  window.startNextPeriod = async function (final) {
    if (final && !confirm('오늘 교육을 종료하시겠습니까? 마지막 QR이 표시되고, 학생들은 이 QR을 찍으면 종료 서명을 하게 됩니다.')) return;
    const btn = document.getElementById(final ? 'btn-end-session' : 'btn-start-period');
    btn.disabled = true;
    try {
      const res = await fetch(`${FUNC_URL}/startQrPeriod`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({ date: document.getElementById('session-date').value, final: !!final })
      });
      if (!res.ok) throw new Error('요청 실패');
      const data = await res.json();
      currentPeriod = data.period;
      maxPeriod = data.maxPeriod || data.period;
      isFinalPeriod = !!final;
      renderPeriodTabs();
      renderPeriodCounts();
      document.getElementById('session-date').disabled = true;
      document.getElementById('btn-end-session').style.display = 'inline-block';
      updateEndSessionBtn();
      drawQr(data.qrPayload);
      resubscribeCheckins();
      startSessionListener();
      startMakeupRequestsListener();
      startScheduleListener();
      startRotateLoop();
    } catch (e) {
      alert((final ? '교육 종료' : '교시 시작') + '에 실패했습니다: ' + e.message);
    } finally {
      if (!final || !isFinalPeriod) btn.disabled = false;
    }
  };

  window.handleNextPeriodClick = function () {
    if (currentPeriod && currentPeriod < maxPeriod) {
      window.switchToPeriod('next');
    } else {
      window.startNextPeriod();
    }
  };

  window.switchToPeriod = async function (direction) {
    try {
      const res = await fetch(`${FUNC_URL}/switchQrPeriod`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({ date: document.getElementById('session-date').value, direction })
      });
      const data = await res.json();
      if (!data.success) { alert(data.message); return; }
      currentPeriod = data.period;
      maxPeriod = data.maxPeriod || data.period;
      isFinalPeriod = !!data.isFinalPeriod;
      renderPeriodTabs();
      renderPeriodCounts();
      updateEndSessionBtn();
      drawQr(data.qrPayload);
      resubscribeCheckins();
      startRotateLoop();
    } catch (e) {
      alert('교시 이동에 실패했습니다: ' + e.message);
    }
  };

  function updateEndSessionBtn() {
    const btn = document.getElementById('btn-end-session');
    if (!btn) return;
    btn.disabled = isFinalPeriod;
    btn.textContent = isFinalPeriod ? '교육 종료됨' : '교육 종료 QR 및 서명';
  }

  window.endSession = async function () {
    if (!confirm('오늘 세션을 종료하시겠습니까? 종료 후에는 이 세션으로 더 이상 체크인할 수 없습니다.')) return;
    const btn = document.getElementById('btn-end-session');
    btn.disabled = true;
    try {
      const res = await fetch(`${FUNC_URL}/endQrSession`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({ date: document.getElementById('session-date').value })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || '종료 실패');

      clearRotateInterval();
      if (checkinsUnsub) { checkinsUnsub(); checkinsUnsub = null; }
      if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
      if (makeupRequestsUnsub) { makeupRequestsUnsub(); makeupRequestsUnsub = null; }
      if (scheduleUnsub) { scheduleUnsub(); scheduleUnsub = null; }
      currentPeriod = null;
      maxPeriod = 0;
      isFinalPeriod = false;
      document.getElementById('qr-canvas').innerHTML = '<span class="qr-placeholder">시작 전</span>';
      document.getElementById('qr-countdown').textContent = '';
      document.getElementById('session-date').disabled = false;
      btn.style.display = 'none';
      renderPeriodTabs();
      updatePanelHeader();
      renderPeriodCounts();
      renderSchedule(null);
    } catch (e) {
      alert('세션 종료에 실패했습니다: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  };

  async function resumeIfInProgress() {
    try {
      const sid = sessionId();
      const snap = await getDoc(doc(db, 'sessions', sid));
      if (!snap.exists()) return;
      const data = snap.data();
      if (!data.currentPeriod || data.status === 'closed') return;
      currentPeriod = data.currentPeriod;
      maxPeriod = data.maxPeriod || data.currentPeriod;
      isFinalPeriod = data.finalPeriod === data.currentPeriod;
      renderPeriodTabs();
      renderPeriodCounts();
      document.getElementById('session-date').disabled = true;
      document.getElementById('btn-end-session').style.display = 'inline-block';
      updateEndSessionBtn();
      const res = await fetch(`${FUNC_URL}/rotateQrToken`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({})
      });
      if (!res.ok) return;
      const rdata = await res.json();
      if (!rdata.success) return;
      drawQr(rdata.qrPayload);
      resubscribeCheckins();
      startSessionListener();
      startMakeupRequestsListener();
      startScheduleListener();
      startRotateLoop();
    } catch (e) {
      console.warn('이어받기 실패:', e);
    }
  }

  function startSessionListener() {
    if (sessionUnsub) { sessionUnsub(); sessionUnsub = null; }
    const sid = sessionId();
    sessionUnsub = onSnapshot(doc(db, 'sessions', sid), (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      if (!data.currentPeriod) return;
      currentPeriod = data.currentPeriod;
      maxPeriod = data.maxPeriod || data.currentPeriod;
      isFinalPeriod = data.finalPeriod === data.currentPeriod;
      renderPeriodTabs();
      renderPeriodCounts();
      updateEndSessionBtn();
      drawQr(JSON.stringify({ a: ORG_ID, s: sid, p: data.currentPeriod, t: data.periodToken }));
    });
  }

  // ── 오늘의 시간표(참고 표시 전용 — QR 시작/제어와 완전히 무관, 없어도 QR 기능에 영향 없음) ──
  function startScheduleListener() {
    if (scheduleUnsub) { scheduleUnsub(); scheduleUnsub = null; }
    const sid = sessionId();
    scheduleUnsub = onSnapshot(doc(db, 'schedule', sid), (snap) => {
      renderSchedule(snap.exists() ? (snap.data().courses || []) : null);
    });
  }

  function renderSchedule(courses) {
    const el = document.getElementById('schedule-list');
    if (!el) return;
    if (!courses || !courses.length) {
      el.innerHTML = '<div class="hist-empty">등록된 일정 없음</div>';
      return;
    }
    el.innerHTML = '<table class="hist-table"><thead><tr><th>시간</th><th>제목</th><th>강사</th><th>소속</th></tr></thead><tbody>' +
      courses.map(c => `<tr><td>${escapeHtml(c.time || '')}</td><td>${escapeHtml(c.title || '')}</td><td>${escapeHtml(c.instructor || '')}</td><td>${escapeHtml(c.affiliation || '')}</td></tr>`).join('') +
      '</tbody></table>';
  }

  // ── 출석 서명요청 ──
  let makeupAllStudents = [];

  async function loadAllOrgStudents() {
    try {
      const snap = await getDocs(query(collection(db, 'students'), where('orgId', '==', ORG_ID)));
      makeupAllStudents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const sel = document.getElementById('makeup-student-select');
      if (!sel) return;
      const options = makeupAllStudents.map(s =>
        `<option value="${s.id}">${escapeHtml(s.name || s.id)} (${escapeHtml(String(s.phone || '').slice(-4))})</option>`
      ).join('');
      sel.innerHTML = '<option value="">학생 선택</option>' + options;
    } catch (e) {
      console.warn('학생 목록 조회 실패:', e);
    }
  }

  window.sendMakeupRequest = async function () {
    const kakaoId = document.getElementById('makeup-student-select').value;
    const period = parseInt(document.getElementById('makeup-period-input').value, 10);
    if (!kakaoId || !period || period < 1) { alert('학생과 교시를 선택해주세요.'); return; }
    const student = makeupAllStudents.find(s => s.id === kakaoId);
    const sid = sessionId();
    try {
      await setDoc(doc(db, 'sessions', sid, 'makeupRequests', `${kakaoId}_${period}`), {
        kakaoId, name: student ? student.name || '' : '', phone: student ? student.phone || '' : '',
        period, status: 'pending', requestedAt: serverTimestamp(),
        signature: null, submittedAt: null, approvedAt: null, rejectedAt: null,
      }, { merge: true });
      alert('요청을 보냈습니다.');
    } catch (e) { alert('요청 실패: ' + e.message); }
  };

  const MAKEUP_STATUS_LABEL = { pending: '대기중(미제출)', submitted: '제출됨 — 검토 필요', approved: '승인됨', rejected: '거부됨' };

  function renderMakeupRequestsList(list) {
    const el = document.getElementById('makeup-requests-list');
    if (!el) return;
    if (!list.length) { el.innerHTML = '<div class="hist-empty">요청 내역이 없습니다.</div>'; return; }
    el.innerHTML = list.map(r => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="flex:1;font-size:13px;">${escapeHtml(r.name || r.kakaoId)} · ${r.period}교시 · ${MAKEUP_STATUS_LABEL[r.status] || r.status}</span>
        ${r.status === 'submitted' ? `
          <button class="btn-primary" style="padding:6px 16px;font-size:12px;" onclick="reviewMakeupRequest('${r.kakaoId}', ${r.period}, 'approve')">승인</button>
          <button class="btn-primary" style="padding:6px 16px;font-size:12px;background:#B91C1C;" onclick="reviewMakeupRequest('${r.kakaoId}', ${r.period}, 'reject')">거부</button>
        ` : ''}
      </div>
    `).join('');
  }

  function startMakeupRequestsListener() {
    if (makeupRequestsUnsub) { makeupRequestsUnsub(); makeupRequestsUnsub = null; }
    const sid = sessionId();
    makeupRequestsUnsub = onSnapshot(collection(db, 'sessions', sid, 'makeupRequests'), (snap) => {
      const list = [];
      snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      renderMakeupRequestsList(list);
    });
  }

  window.reviewMakeupRequest = async function (kakaoId, period, action) {
    try {
      const res = await fetch(`${FUNC_URL}/reviewMakeupRequest`, {
        method: 'POST', headers: await authHeader(),
        body: JSON.stringify({ sessionId: sessionId(), kakaoId, period, action })
      });
      const data = await res.json();
      if (!data.success) { alert(data.message); return; }
    } catch (e) { alert('처리 실패: ' + e.message); }
  };

  function startRotateLoop() {
    clearRotateInterval();
    countdownSec = 5;
    updateCountdownLabel();
    countdownInterval = setInterval(() => {
      countdownSec--;
      if (countdownSec <= 0) countdownSec = 5;
      updateCountdownLabel();
    }, 1000);
    rotateInterval = setInterval(rotateQr, 5000);
  }

  function updateCountdownLabel() {
    document.getElementById('qr-countdown').textContent = `${countdownSec}초 후 갱신`;
  }

  async function rotateQr() {
    try {
      const res = await fetch(`${FUNC_URL}/rotateQrToken`, {
        method: 'POST',
        headers: await authHeader(),
        body: JSON.stringify({})
      });
      if (!res.ok) throw new Error('갱신 실패');
      const data = await res.json();
      if (currentPeriod == null) return;
      drawQr(data.qrPayload);
      countdownSec = 5;
      updateCountdownLabel();
    } catch (e) {
      console.warn('QR 갱신 실패:', e);
    }
  }

  // 학생 웹 주소 — QR을 이 링크로 감싸서, 가입 전인 학생이 일반 카메라 앱으로 찍어도
  // 학생 웹으로 넘어가 로그인/가입까지 이어서 하고, 끝나자마자 자동으로 이 QR로 출석
  // 처리되도록 한다(학생 웹 index.html의 consumePendingScanIfAny 참고).
  const STUDENT_WEB_URL = 'https://knadlg1.github.io/ce/';

  function drawQr(payload) {
    const container = document.getElementById('qr-canvas');
    container.innerHTML = '';
    const url = STUDENT_WEB_URL + '?scan=' + encodeURIComponent(payload);
    new QRCode(container, { text: url, width: 440, height: 440, correctLevel: QRCode.CorrectLevel.M });
  }

  function currentQrLabel(period, isFinal) {
    if (!period) return '교시 미시작';
    if (isFinal) {
      return period === 1 ? '교육시작 전\n교육 종료' : `${period - 1}교시 종료\n교육 종료`;
    }
    if (period === 1) return '교육시작 전';
    return `${period - 1}교시 종료\n${period}교시 시작`;
  }

  function renderPeriodTabs() {
    document.getElementById('btn-start-period').textContent = currentPeriod ? '다음 교시 시작' : '교육시작';
    const tabsEl = document.getElementById('period-tabs');
    const labelEl = document.getElementById('current-period-label');
    labelEl.style.display = 'block';
    labelEl.textContent = currentQrLabel(currentPeriod, isFinalPeriod);
    updatePrevNextButtons();
    if (!currentPeriod) {
      tabsEl.innerHTML = '';
      return;
    }
    let html = '';
    for (let i = 1; i <= currentPeriod; i++) {
      const finalBadge = (isFinalPeriod && i === currentPeriod) ? ' 🏁마지막' : '';
      html += `<div class="period-tab${i === currentPeriod ? ' active' : ''}">${i}교시${finalBadge}</div>`;
    }
    tabsEl.innerHTML = html;
  }

  function updatePrevNextButtons() {
    const prevBtn = document.getElementById('btn-prev-period');
    if (!prevBtn) return;
    prevBtn.disabled = !currentPeriod || currentPeriod <= 1;
  }

  function startRosterListener() {
    const sid = sessionId();
    if (rosterUnsub) rosterUnsub();
    rosterUnsub = onSnapshot(collection(db, 'sessions', sid, 'roster'), (snap) => {
      lastRosterSize = snap.size;
      updatePanelHeader();
    });
  }

  let rosterPollInterval = null;

  function startRosterPoll() {
    if (rosterPollInterval) clearInterval(rosterPollInterval);
    rosterPollInterval = setInterval(async () => {
      try {
        const sid = sessionId();
        const snap = await getDocs(collection(db, 'sessions', sid, 'roster'));
        lastRosterSize = snap.size;
        updatePanelHeader();
      } catch (e) {
        console.warn('수강생 명단 폴링 실패:', e);
      }
    }, 5000);
  }

  function stopRosterPoll() {
    if (rosterPollInterval) { clearInterval(rosterPollInterval); rosterPollInterval = null; }
  }

  let lastRosterSize = 0;
  let lastCheckinSize = 0;

  function updatePanelHeader() {
    const el = document.getElementById('roster-panel-header');
    if (currentPeriod == null) {
      el.innerHTML = `<div>오늘 수강생 ${lastRosterSize}명</div><div style="margin-top:6px;font-size:14px;font-weight:600;color:var(--muted);">이번 교시 체크 -</div>`;
      return;
    }
    const absent = Math.max(lastRosterSize - lastCheckinSize, 0);
    el.innerHTML = `<div>오늘 수강생 ${lastRosterSize}명</div><div style="margin-top:6px;font-size:14px;font-weight:600;color:var(--muted);">이번 교시 체크 ${lastCheckinSize}명 / 미체크 ${absent}명</div>`;
  }

  function maskName(name) {
    const s = String(name || '').trim();
    if (s.length <= 1) return s;
    return s.slice(0, -1) + '*';
  }
  function last4Phone(phone) {
    const digits = String(phone || '').replace(/\D/g, '');
    return digits.length >= 4 ? digits.slice(-4) : digits;
  }
  function renderRosterPanel(list) {
    const listEl = document.getElementById('roster-panel-list');
    if (!list.length) {
      listEl.innerHTML = '<div class="roster-empty">아직 체크한 학생이 없습니다.</div>';
      return;
    }
    listEl.innerHTML = list.map(c =>
      `<div class="roster-item"><span>${escapeHtml(maskName(c.name))}</span><span class="roster-phone">${escapeHtml(last4Phone(c.phone))}</span></div>`
    ).join('');
  }

  function resubscribeCheckins() {
    if (checkinsUnsub) { checkinsUnsub(); checkinsUnsub = null; }
    if (currentPeriod == null) { renderRosterPanel([]); return; }
    const sid = sessionId();
    const q = query(collection(db, 'sessions', sid, 'checkins'), where('period', '==', currentPeriod));
    checkinsUnsub = onSnapshot(q, (snap) => {
      lastCheckinSize = snap.size;
      updatePanelHeader();
      renderPeriodCounts();
      const list = [];
      snap.forEach(d => list.push(d.data()));
      renderRosterPanel(list);
    });
  }

  let periodCounts = {};

  function startPeriodCountsListener() {
    const sid = sessionId();
    if (periodCountsUnsub) periodCountsUnsub();
    periodCountsUnsub = onSnapshot(collection(db, 'sessions', sid, 'checkins'), (snap) => {
      const counts = {};
      snap.forEach(d => {
        const p = d.data().period;
        if (p != null) counts[p] = (counts[p] || 0) + 1;
      });
      periodCounts = counts;
      renderPeriodCounts();
    });
  }

  function renderPeriodCounts() {
    const el = document.getElementById('period-counts');
    if (!el) return;
    if (currentPeriod == null) { el.innerHTML = ''; return; }
    let html = '';
    for (let p = 1; p <= currentPeriod; p++) {
      html += `<span>${p}교시 ${periodCounts[p] || 0}명</span>`;
    }
    el.innerHTML = html;
  }

  // ── 로그인 상태 진입점 ──
  onAuthStateChanged(auth, async (user) => {
    if (!user || user.isAnonymous) {
      // 익명 세션(가입화면 기관검색용)이거나 로그아웃 상태 — 실제 관리자 로그인 아님.
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('auth-wrap').style.display = 'flex';
      return;
    }
    try {
      const adminSnap = await getDoc(doc(db, 'admins', user.uid));
      if (!adminSnap.exists() || !adminSnap.data().orgId) {
        await auth.signOut();
        const errEl = document.getElementById('login-error');
        if (errEl) {
          errEl.textContent = '이 계정에 연결된 기관 정보를 찾을 수 없습니다.';
          errEl.style.display = 'block';
        }
        return;
      }
      ORG_ID = adminSnap.data().orgId;
      orgName = adminSnap.data().orgName || '';
      await enterDashboard();
    } catch (e) {
      console.warn('로그인 상태 확인 실패:', e);
    }
  });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

:root {
  --brand: #6c63ff;
  --brand-dark: #5651d5;
  --brand-xlight: #ede9fe;
  --canvas: #f4f5f7;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --text: #111827;
  --muted: #6B7280;
  --radius: 10px;
  --pill: 50px;
  --shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--canvas);color:var(--text);letter-spacing:-0.01em;min-height:100vh;}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--surface);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.3);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo-mark{width:64px;height:64px;background:var(--brand);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;margin:0 auto 14px;}
.auth-logo-title{font-size:22px;font-weight:800;color:var(--text);margin-top:8px;letter-spacing:-0.02em;}
.auth-logo-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.auth-form-label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase;}
.auth-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);outline:none;margin-bottom:14px;background:#fff;transition:border-color .15s;}
.auth-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(108,99,255,.12);}
.auth-btn{width:100%;padding:15px;border-radius:var(--pill);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:-0.01em;}
.auth-btn:active{transform:scale(0.97);}
.auth-btn-primary{background:var(--brand);color:#fff;margin-bottom:10px;}
.auth-btn-primary:hover{background:var(--brand-dark);}
.auth-error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}

/* 기관 검색 자동완성 */
.org-search-wrap{position:relative;}
.org-dropdown{display:none;position:absolute;top:calc(100% - 8px);left:0;right:0;background:#fff;border:1.5px solid var(--border);border-radius:10px;max-height:200px;overflow-y:auto;z-index:20;box-shadow:var(--shadow);}
.org-option{padding:10px 14px;font-size:14px;cursor:pointer;}
.org-option:hover{background:var(--brand-xlight);color:var(--brand);}
.org-option-empty{padding:10px 14px;font-size:13px;color:var(--muted);}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar-title{font-size:18px;font-weight:800;color:var(--brand);letter-spacing:-0.02em;}
.btn-logout{background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:var(--pill);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;}
.btn-logout:hover{border-color:var(--brand);color:var(--brand);}

#dashboard{display:none;flex-direction:column;min-height:100vh;}
.page{padding:32px;}

/* ── QR PAGE ── */
.qr-wrap{display:flex;gap:24px;align-items:stretch;justify-content:center;}
.qr-left{display:flex;flex-direction:column;align-items:center;gap:18px;}
.qr-card{background:var(--surface);border-radius:20px;padding:36px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:16px;}
#qr-canvas{border-radius:12px;min-width:440px;min-height:440px;display:flex;align-items:center;justify-content:center;}
.qr-placeholder{font-size:20px;font-weight:700;color:var(--muted);}
.qr-countdown{font-size:15px;font-weight:700;color:var(--brand);}
.current-period{font-size:20px;font-weight:800;color:var(--text);white-space:pre-line;}
.btn-primary{background:var(--brand);color:#fff;border:none;padding:14px 32px;border-radius:var(--pill);font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.qr-body{display:flex;align-items:center;gap:16px;}
.period-tabs{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto;}
.period-tab{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:800;text-align:center;background:#fff;color:var(--text);border:1.5px solid var(--border);white-space:nowrap;}
.period-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}

/* ── ROSTER PANEL ── */
.roster-panel{background:var(--surface);border-radius:20px;padding:24px;box-shadow:var(--shadow);width:340px;flex-shrink:0;display:flex;flex-direction:column;}
.roster-panel-header{font-size:18px;font-weight:800;color:var(--brand);margin-bottom:14px;text-align:center;}
.roster-panel-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;flex:1;}
.roster-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--canvas);border-radius:8px;font-size:14px;font-weight:600;}
.roster-phone{color:var(--muted);font-weight:700;font-size:13px;}
.roster-empty{font-size:13px;color:var(--muted);text-align:center;padding:20px;}

/* ── 출석 서명요청 / 오늘의 시간표 (공용 카드) ── */
.hist-detail-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;overflow-x:auto;}
.hist-empty{font-size:13px;color:var(--muted);padding:8px;}
.hist-table{border-collapse:collapse;width:100%;font-size:13px;}
.hist-table th,.hist-table td{border:1px solid var(--border);padding:8px 12px;text-align:center;white-space:nowrap;}
.hist-table th{background:var(--brand-xlight);color:var(--brand);font-weight:800;}
</style>
</head>
<body>

<!-- ── AUTH ── -->
<div id="auth-wrap" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">연</div>
      <div class="auth-logo-title">연수교육 QR 인증</div>
      <div class="auth-logo-sub">관리자 로그인</div>
    </div>
    <div class="auth-error" id="login-error"></div>
    <label class="auth-form-label">이메일</label>
    <input class="auth-input" id="login-email" type="email" placeholder="admin@example.com">
    <label class="auth-form-label">비밀번호</label>
    <input class="auth-input" id="login-pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="auth-btn auth-btn-primary" onclick="doLogin()">로그인</button>
    <div style="text-align:center;margin-top:6px;">
      <a href="javascript:void(0)" onclick="showSignup()" style="color:var(--brand);font-size:13px;text-decoration:none;font-weight:600;">계정이 없으신가요? 회원가입</a>
    </div>
  </div>
  <div class="auth-card" id="signup-card" style="display:none;">
    <div class="auth-logo">
      <div class="auth-logo-mark">연</div>
      <div class="auth-logo-title">회원가입</div>
      <div class="auth-logo-sub">기관을 검색해서 선택해주세요</div>
    </div>
    <div class="auth-error" id="signup-error"></div>

    <label class="auth-form-label">기관 검색</label>
    <div class="org-search-wrap">
      <input class="auth-input" id="signup-org-search" type="text" placeholder="기관명 입력" autocomplete="off" oninput="onOrgSearchInput()">
      <div class="org-dropdown" id="signup-org-dropdown"></div>
    </div>
    <label class="auth-form-label">이메일</label>
    <input class="auth-input" id="signup-email" type="email" placeholder="admin@example.com">
    <label class="auth-form-label">비밀번호 (최소 6자)</label>
    <input class="auth-input" id="signup-pw" type="password" placeholder="비밀번호 입력">
    <button class="auth-btn auth-btn-primary" id="btn-submit-signup" onclick="doSignup()">가입하기</button>

    <div style="text-align:center;margin-top:6px;">
      <a href="javascript:void(0)" onclick="showLoginFromSignup()" style="color:var(--muted);font-size:13px;text-decoration:none;">로그인으로 돌아가기</a>
    </div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">연수교육 QR 인증</div>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <div class="page">
    <div class="qr-wrap">
      <div class="qr-left">
        <div style="display:flex;align-items:center;gap:10px;">
          <label class="auth-form-label" style="margin:0;font-size:17px;font-weight:800;">세션 날짜</label>
          <input type="date" id="session-date" class="auth-input" style="width:auto;margin:0;font-size:26px;font-weight:800;padding:14px 18px;">
        </div>
        <div class="qr-card">
          <div class="current-period" id="current-period-label">교시 미시작</div>
          <div class="qr-body">
            <div class="period-tabs" id="period-tabs"></div>
            <div id="qr-canvas"><span class="qr-placeholder">시작 전</span></div>
          </div>
          <div class="qr-countdown" id="qr-countdown"></div>
        </div>
        <button class="btn-primary" id="btn-prev-period" onclick="switchToPeriod('prev')" disabled>◀ 이전 교시</button>
        <button class="btn-primary" id="btn-start-period" onclick="handleNextPeriodClick()">교육시작</button>
        <button class="btn-primary" id="btn-end-session" onclick="startNextPeriod(true)" style="display:none;">교육 종료 QR 및 서명</button>
      </div>
      <div class="roster-panel">
        <div class="roster-panel-header" id="roster-panel-header"><div>오늘 수강생 0명</div><div style="margin-top:6px;font-size:14px;font-weight:600;color:var(--muted);">이번 교시 체크 -</div></div>
        <div id="period-counts" style="display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;"></div>
        <div class="roster-panel-list" id="roster-panel-list">
          <div class="roster-empty">교시를 시작하면 표시됩니다.</div>
        </div>
      </div>
    </div>

    <div class="hist-detail-card" style="max-width:900px;margin:24px auto 0;">
      <div style="font-size:18px;font-weight:800;color:var(--brand);margin-bottom:14px;">출석 서명요청</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <select class="auth-input" id="makeup-student-select" style="margin:0;width:auto;flex:1;min-width:200px;">
          <option value="">학생 선택</option>
        </select>
        <input type="number" min="1" id="makeup-period-input" class="auth-input" placeholder="교시" style="margin:0;width:90px;">
        <button class="btn-primary" onclick="sendMakeupRequest()">요청 보내기</button>
      </div>
      <div id="makeup-requests-list">
        <div class="hist-empty">요청 내역이 없습니다.</div>
      </div>
    </div>

    <!-- 오늘의 시간표 — 참고 표시 전용. QR 시작/제어 버튼과 완전히 무관하며, 비어있어도
         (첫 체크인 전이거나 그날 KMA에 등록된 수업이 없으면) QR 기능에는 전혀 영향 없다. -->
    <div class="hist-detail-card" style="max-width:900px;margin:24px auto 0;">
      <div style="font-size:18px;font-weight:800;color:var(--brand);margin-bottom:14px;">오늘의 시간표</div>
      <div id="schedule-list">
        <div class="hist-empty">교시를 시작하면 표시됩니다.</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
